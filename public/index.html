<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BranchPort</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f7f6f2; --surface:#fefdfb; --ink:#1b1a17; --ink2:#55534c; --muted:#8d8a7f;
    --line:#e7e4da; --axis:#c9c5b7;
    /* 국면색은 색각 검증(all-pairs ΔE) 통과본 — 이전 청록/녹색 조합은 실행↔탐색 ΔE 7.4로 FAIL */
    --edit:#eb6834; --exec:#2a78d6; --explore:#1baf7a; --chat:#9a9587;
    --err:#d03b3b; --sel:rgba(42,120,214,.10); --chip:rgba(27,26,23,.06);
    --shadow:0 1px 3px rgba(20,18,12,.07), 0 10px 28px rgba(20,18,12,.06);
    --glow:rgba(42,120,214,.35);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#131210; --surface:#1c1b18; --ink:#f3f1ea; --ink2:#c2beb0; --muted:#8d8a7f;
      --line:#2d2b26; --axis:#4a473f;
      --edit:#d95926; --exec:#3987e5; --explore:#199e70; --chat:#7b776b;
      --err:#e07362; --sel:rgba(57,135,229,.16); --chip:rgba(255,255,255,.06);
      --shadow:0 1px 3px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.35);
      --glow:rgba(57,135,229,.4);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    background-image:radial-gradient(var(--line) 1px, transparent 1px);
    background-size:24px 24px;
  }

  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 22px; border-bottom:1px solid var(--line); position:fixed; top:0; left:0; right:0;
    background:color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter:blur(16px) saturate(1.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.5); z-index:10;}
  header h1{font-size:15px; margin:0; font-weight:700; display:flex; align-items:center; gap:8px; letter-spacing:-.01em;}
  header h1 .dot{width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--exec),var(--edit));
    animation:breathe 3.5s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.25);opacity:1}}
  select#project-select{background:var(--chip); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:6px 10px; font-size:12.5px; max-width:340px;}
  .meta{font-size:12px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; padding:8px 22px; font-size:11.5px; color:var(--ink2);
    border-bottom:1px solid var(--line); align-items:center;
    background:color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter:blur(16px) saturate(1.5);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);
    position:fixed; top:49px; left:0; right:0; z-index:10;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .ltile{width:15px;height:15px;border-radius:50%;background:var(--surface);border:2px solid;
    display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .ltile svg{width:9px;height:9px;}

  #stage{position:fixed; inset:87px 0 0 0; overflow:hidden; cursor:grab;}
  #stage.panning{cursor:grabbing;}
  #viewport{position:absolute; top:0; left:0; transform-origin:0 0;
    transition:transform .55s cubic-bezier(.22,.8,.28,1);}
  #viewport.instant{transition:none;}
  #map{position:relative;}
  svg#links{position:absolute; inset:0; pointer-events:none; overflow:visible;}
  .link{fill:none; stroke:var(--axis); stroke-width:2; stroke-linecap:round;
    stroke-dasharray:900; stroke-dashoffset:900; animation:draw .7s ease forwards;
    transition:opacity .3s ease, stroke .3s ease, stroke-width .3s ease;}
  @keyframes draw{to{stroke-dashoffset:0}}
  .link.path{stroke:var(--exec); stroke-width:3; opacity:1;}
  .seam{position:absolute; font-size:9.5px; color:var(--muted); z-index:1;
    background:var(--bg); padding:1px 6px; border-radius:99px; border:1px dashed var(--axis);
    transform:translate(-50%,-50%); white-space:nowrap; transition:opacity .3s ease;}
  .node-label{position:absolute; transform:translate(-50%,0); z-index:1;
    font-size:10.5px; color:var(--ink2); max-width:100px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; text-align:center; pointer-events:none;
    opacity:0; animation:labelIn .3s ease forwards; transition:opacity .3s ease;}
  @keyframes labelIn{to{opacity:1}}
  /* 조용한 갱신(자동 반영) 중에는 등장 애니메이션을 재생하지 않는다 */
  #map.noanim .node,#map.noanim .node-label{animation:none; opacity:1;}
  #map.noanim .link{animation:none; stroke-dashoffset:0;}
  .node-label.fork{color:#9b7fd4; font-weight:600;}
  .node-label.hide-self{opacity:0 !important;}
  #loading{position:fixed; top:96px; left:22px; font-size:13px; color:var(--muted); z-index:11;}
  #empty{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--muted); font-size:13.5px; text-align:center; line-height:1.8;}

  /* ── node: a small circle at rest, morphs into a rounded detail card when clicked ── */
  .node{position:absolute; left:0; top:0; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--surface); border:2.5px solid var(--pc);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 0 0 0 transparent; z-index:2;
    transition:width .4s cubic-bezier(.2,.8,.2,1), height .4s cubic-bezier(.2,.8,.2,1),
      border-radius .4s cubic-bezier(.2,.8,.2,1), border-color .25s ease, opacity .3s ease, box-shadow .25s ease;
    opacity:0; animation:popIn .32s cubic-bezier(.3,.7,.3,1.3) forwards;}
  @keyframes popIn{from{opacity:0; transform:translate(-50%,-50%) scale(.3)} to{opacity:1; transform:translate(-50%,-50%) scale(1)}}
  .node:hover:not(.expanded){box-shadow:0 0 0 5px var(--glow); border-color:var(--pc);}
  .node.deleg{box-shadow:0 0 0 2.5px var(--pc);}
  .node.err::after{content:"⚠"; position:absolute; top:-6px; right:-6px; font-size:11px;
    background:var(--err); color:#fff; border-radius:50%; width:15px; height:15px;
    display:flex; align-items:center; justify-content:center; line-height:1;}
  .node.selected{border-color:var(--exec); border-width:3px;
    background:linear-gradient(var(--sel),var(--sel)), var(--surface);
    animation:popIn .32s cubic-bezier(.3,.7,.3,1.3) forwards, selPulse 1.6s ease-in-out infinite;}
  @keyframes selPulse{0%,100%{box-shadow:0 0 0 0 var(--glow)} 50%{box-shadow:0 0 0 7px transparent}}
  /* the tint reads fine on a small circle but muddies text once it grows into
     the detail card — drop it there, keep the border + pulse only */
  .node.expanded.selected{background:var(--surface);}
  /* absolute + translate(-50%,-50%) centers the icon's own box on the node's
     exact center point — robust regardless of odd/even pixel rounding on the
     node's size, unlike relying purely on flex + percentage sizing. */
  .node .icon{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:52%; height:52%; color:var(--pc); transition:opacity .2s ease; pointer-events:none;}
  .node .icon svg{width:100%; height:100%; display:block;}
  .node.expanded .icon{opacity:0;}

  .node .detail{opacity:0; pointer-events:none; width:100%; height:100%; padding:24px 26px;
    overflow-y:auto; transition:opacity .25s ease .1s;}
  .node.expanded .detail{opacity:1; pointer-events:auto;}
  /* width/height are viewport-relative (vw/vh), not map-space px — combined
     with the counter-scale transform applied in JS at expand time, the card's
     ON-SCREEN size always ends up the same regardless of how zoomed in the
     camera happens to be, instead of ballooning with the ambient zoom. */
  .node.expanded{width:min(86vw,520px) !important; height:70vh !important; border-radius:22px;
    border-width:1.5px; box-shadow:0 20px 60px rgba(0,0,0,.28), 0 0 0 1px var(--pc); z-index:15; cursor:default;}
  .node.expanded:hover{box-shadow:0 20px 60px rgba(0,0,0,.28), 0 0 0 1px var(--pc);}

  .d-fork{color:#9b7fd4; font-size:12px; font-weight:700; margin-bottom:3px;}
  .d-title{font-size:16.5px; font-weight:700; line-height:1.42; margin-bottom:6px;}
  .d-gist{font-size:13px; color:var(--ink2); line-height:1.55; margin-bottom:6px;}
  .d-meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .d-chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{font-size:11.5px; background:var(--chip); border-radius:99px; padding:3px 10px; color:var(--ink2);}
  .chip.err{color:var(--err); font-weight:700;}
  .d-msg{font-size:13.5px; line-height:1.62; padding:11px 14px; border-radius:12px; margin-bottom:8px; white-space:pre-wrap; word-break:break-word;}
  .d-msg.user{background:var(--pc); color:#fff;}
  .d-msg.ai{background:var(--chip); color:var(--ink);}
  .d-h{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px;}
  .d-list{margin:0; padding-left:17px; font-size:12.5px; color:var(--ink2); line-height:1.78;}
  .d-close{position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%;
    border:0; background:var(--chip); color:var(--ink2); font-size:13px; cursor:pointer;}

  /* ── 갈래(브랜치) 대화 ── */
  .node .brb{position:absolute; bottom:-6px; right:-6px; font-size:9.5px; font-weight:700;
    background:#9b7fd4; color:#fff; border-radius:99px; min-width:15px; height:15px; padding:0 4px;
    display:flex; align-items:center; justify-content:center; line-height:1;}
  .brchip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    background:var(--chip); border:1px dashed #9b7fd4; color:var(--ink2); border-radius:99px;
    padding:4px 11px; cursor:pointer;}
  .brchip:hover{border-style:solid; color:var(--ink);}
  .br-msgs{display:flex; flex-direction:column; gap:6px; margin:8px 0;}
  .br-msg{font-size:12.8px; line-height:1.55; padding:8px 11px; border-radius:10px;
    white-space:pre-wrap; word-break:break-word;}
  .br-msg.user{background:#9b7fd4; color:#fff; align-self:flex-end; max-width:88%;}
  .br-msg.ai{background:var(--chip); color:var(--ink); align-self:flex-start; max-width:92%;}
  .br-input{display:flex; gap:6px; margin-top:8px;}
  .br-input input{flex:1; font:inherit; font-size:13px; padding:8px 11px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);}

  /* Apple-notification-style banner: docked at the very top, dropping in from
     above the viewport and sliding back up the same way when dismissed —
     rather than the old bottom-docked pill. */
  #selbar{position:fixed; left:50%; top:14px; z-index:60;
    display:flex; gap:12px; align-items:center;
    background:color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter:blur(20px) saturate(1.8); -webkit-backdrop-filter:blur(20px) saturate(1.8);
    border:1px solid var(--line); border-radius:16px; padding:10px 12px 10px 18px;
    box-shadow:0 14px 34px rgba(20,18,12,.28); font-size:13px;
    transform:translate(-50%,-140%); opacity:0; pointer-events:none;
    transition:transform .4s cubic-bezier(.32,1.4,.5,1), opacity .25s ease;}
  #selbar.on{transform:translate(-50%,0); opacity:1; pointer-events:auto;}
  #selbar b{font-variant-numeric:tabular-nums; display:inline-block; color:var(--exec);}
  #selbar b.bump{animation:bump .28s cubic-bezier(.3,.6,.3,1.4);}
  @keyframes bump{0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)}}
  #sb-hint{color:var(--ink2);}
  #sb-hint b{color:var(--exec); font-weight:700;}
  #sb-active-group{display:none; align-items:center; gap:12px;}
  #selbar.active #sb-hint{display:none;}
  #selbar.active #sb-active-group{display:flex;}
  button{font:inherit; cursor:pointer;}
  .btn{border:0; border-radius:99px; padding:8px 16px; font-size:13px; font-weight:650;
    transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--exec); color:#fff;}
  .btn.primary:disabled{opacity:.55; cursor:wait;}
  .btn.ghost{background:var(--chip); color:var(--ink2);}

  #home-btn{position:fixed; right:20px; bottom:20px; z-index:20; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink2); font-size:16px;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .2s ease;}
  #home-btn.show{opacity:1; pointer-events:auto;}
  #home-btn:hover{transform:scale(1.07);}

  #modal{position:fixed; inset:0; background:rgba(20,18,12,.45); z-index:40; display:none;
    align-items:center; justify-content:center; padding:26px; backdrop-filter:blur(2px);}
  #modal.open{display:flex; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  #mbox{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:15px;
    width:min(820px,100%); max-height:88vh; display:flex; flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.35); animation:modalIn .2s cubic-bezier(.2,.8,.3,1);}
  @keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}}
  #mbox .hd{padding:18px 22px 0;}
  #mbox h2{font-size:16.5px; margin:0 30px 4px 0;}
  #mbox .m{font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:4px; padding:12px 22px 0; border-bottom:1px solid var(--line);}
  .tab{border:0; background:none; padding:7px 13px 9px; font-size:13px; color:var(--muted);
    border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab.on{color:var(--ink); font-weight:650; border-bottom-color:var(--exec);}
  #mbody{overflow:auto; padding:16px 22px; flex:1;}
  #mbody pre{white-space:pre-wrap; word-break:break-word; margin:0; font-size:12.3px; line-height:1.65;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink2);}
  #mbox .ft{display:flex; gap:8px; padding:14px 22px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .x{position:absolute; top:14px; right:14px; border:0; background:var(--chip); color:var(--ink2);
    width:27px; height:27px; border-radius:50%; font-size:13px;}

  .hint{position:fixed; bottom:16px; left:22px; font-size:11.5px; color:var(--muted); z-index:11;}

  #tooltip{position:fixed; z-index:50; pointer-events:none; max-width:280px;
    background:color-mix(in srgb, var(--ink) 92%, transparent); color:var(--bg);
    backdrop-filter:blur(20px) saturate(1.8); -webkit-backdrop-filter:blur(20px) saturate(1.8);
    padding:7px 12px; border-radius:10px; font-size:12px; line-height:1.5; font-weight:500;
    box-shadow:0 10px 26px rgba(0,0,0,.28); opacity:0;
    transform:translate(-50%,calc(-100% - 14px)) translateY(4px);
    transition:opacity .12s ease, transform .12s ease; white-space:pre-wrap; word-break:break-word;}
  #tooltip.show{opacity:1; transform:translate(-50%,calc(-100% - 14px)) translateY(0);}

  /* ── splash: shown the instant the page paints (pure CSS, no JS delay),
     faded out once the first project's tree has actually rendered ── */
  #splash{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:var(--bg);
    background-image:radial-gradient(var(--line) 1px, transparent 1px); background-size:24px 24px;
    transition:opacity .5s cubic-bezier(.4,0,.2,1);}
  #splash.hide{opacity:0; pointer-events:none;}
  /* mini subway-map diagram — same trunk/branch curve geometry the real tree
     renderer uses (straight trunk + quadratic-bezier lane changes), so the
     splash reads as a preview of the app's own visual language, not a generic logo. */
  .splash-map{overflow:visible;}
  .sp-link{fill:none; stroke-linecap:round; stroke-width:3;
    stroke-dasharray:300; stroke-dashoffset:300;
    animation-name:draw; animation-timing-function:ease; animation-fill-mode:forwards;}
  .sp-node{fill:var(--surface); stroke-width:2.5; opacity:0;
    transform-box:fill-box; transform-origin:center;
    animation-name:spPop; animation-timing-function:cubic-bezier(.3,.7,.3,1.3); animation-fill-mode:forwards;}
  @keyframes spPop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
  .splash-title{font-size:20px; font-weight:700; letter-spacing:-.01em; color:var(--ink);
    opacity:0; animation:splashFadeUp .6s cubic-bezier(.3,.7,.3,1.2) forwards;}
  .splash-sub{font-size:12.5px; color:var(--muted);
    opacity:0; animation:splashFadeUp .6s cubic-bezier(.3,.7,.3,1.2) forwards;}
  @keyframes splashFadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>
  <div id="splash">
    <svg class="splash-map" width="180" height="100" viewBox="0 0 200 110">
      <path class="sp-link" stroke="var(--exec)" d="M14 55 L74 55" style="animation-duration:.45s; animation-delay:.05s;"/>
      <path class="sp-link" stroke="var(--edit)" d="M74 55 L90 55 Q104 55 104 41 L104 39 Q104 25 118 25 L134 25" style="animation-duration:.5s; animation-delay:.6s;"/>
      <path class="sp-link" stroke="var(--exec)" d="M74 55 L134 55" style="animation-duration:.5s; animation-delay:.6s;"/>
      <path class="sp-link" stroke="var(--explore)" d="M74 55 L90 55 Q104 55 104 69 L104 71 Q104 85 118 85 L134 85" style="animation-duration:.5s; animation-delay:.6s;"/>
      <path class="sp-link" stroke="var(--exec)" d="M134 55 L186 55" style="animation-duration:.4s; animation-delay:1.35s;"/>
      <circle class="sp-node" cx="14" cy="55" r="7" stroke="var(--exec)" style="animation-duration:.25s; animation-delay:0s;"/>
      <circle class="sp-node" cx="74" cy="55" r="7" stroke="var(--exec)" style="animation-duration:.25s; animation-delay:.5s;"/>
      <circle class="sp-node" cx="134" cy="25" r="7" stroke="var(--edit)" style="animation-duration:.25s; animation-delay:1.1s;"/>
      <circle class="sp-node" cx="134" cy="55" r="7" stroke="var(--exec)" style="animation-duration:.25s; animation-delay:1.1s;"/>
      <circle class="sp-node" cx="134" cy="85" r="7" stroke="var(--explore)" style="animation-duration:.25s; animation-delay:1.1s;"/>
      <circle class="sp-node" cx="186" cy="55" r="7" stroke="var(--exec)" style="animation-duration:.25s; animation-delay:1.75s;"/>
    </svg>
    <div class="splash-title" style="animation-delay:1.9s;">BranchPort</div>
    <div class="splash-sub" style="animation-delay:2.05s;">세션 트리를 불러오는 중…</div>
  </div>
  <header>
    <h1><span class="dot"></span>BranchPort</h1>
    <select id="project-select"><option>프로젝트 불러오는 중…</option></select>
    <span class="meta" id="meta"></span>
  </header>
  <div class="legend" id="legend"></div>

  <div id="stage">
    <div id="viewport"><div id="map"><svg id="links"></svg></div></div>
  </div>
  <div id="empty">이 프로젝트의 세션 기록을 찾지 못했습니다.</div>
  <div id="loading"></div>
  <button id="home-btn" title="전체 보기">⤢</button>

  <div id="selbar">
    <span id="sb-hint">다른 턴을 <b>shift</b>+클릭하면 경로가 선택됩니다</span>
    <div id="sb-active-group">
      <span>경로 <b id="sb-n"></b>턴 선택됨</span>
      <select id="sb-purpose" class="btn ghost" style="padding:7px 10px">
        <option value="">받는 쪽 목적: 일반</option>
        <option value="continue">이어서 구현</option>
        <option value="bugfix">버그 수정</option>
        <option value="handoff">팀원 설명</option>
      </select>
      <button class="btn primary" id="sb-go">압축 패키지 생성</button>
      <button class="btn ghost" id="sb-clear">해제</button>
    </div>
  </div>

  <div id="modal">
    <div id="mbox">
      <button class="x" onclick="modal.classList.remove('open')">×</button>
      <div class="hd"><h2>압축 패키지</h2><div class="m" id="m-meta"></div></div>
      <div class="tabs">
        <button class="tab on" id="tab-md">패키지 (md)</button>
        <button class="tab" id="tab-json">JSON</button>
      </div>
      <div id="mbody"><pre id="m-pre"></pre></div>
      <div class="ft">
        <button class="btn primary" id="m-copy">복사</button>
        <button class="btn ghost" id="m-dl-md">.md 다운로드</button>
        <button class="btn ghost" id="m-dl-json">.json 다운로드</button>
        <button class="btn ghost" id="m-branch">⑂ 이 패키지로 갈래 대화</button>
      </div>
    </div>
  </div>

  <div class="hint">마우스를 올리면 전체 제목이 보이고, 클릭하면 그 자리에서 확대되며 내용이 열립니다 · shift+클릭으로 경로 구간을 선택해 압축</div>
  <div id="tooltip"></div>

<script>
const PHASE = { edit:"편집", exec:"실행", explore:"탐색", chat:"대화" };
const GLYPH = {
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1L20 7l-3-3L5 16l-1 4z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>',
  exec: '<svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M13 17h6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  explore: '<svg viewBox="0 0 24 24"><g transform="translate(-0.55,-0.55)"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></g></svg>',
  chat: '<svg viewBox="0 0 24 24"><g transform="translate(0,-0.5)"><path d="M4 5h16v11H10l-6 4V5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></g></svg>',
};
document.getElementById("legend").innerHTML =
  Object.keys(PHASE).map(k => `<span><i class="ltile" style="border-color:var(--${k});color:var(--${k})">${GLYPH[k]}</i>${PHASE[k]}</span>`).join("")
  + `<span style="color:var(--muted)">· 크기=작업량 · <b style="color:var(--err)">⚠</b>에러 · 점선=선택경로 · 이중테두리=위임 · <b style="color:#9b7fd4">보라 라벨</b>=포크</span>`;

const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

// custom hover tooltip (replaces the native title attribute, which is slow to
// appear and can't be styled) — shows the turn's full, untruncated headline
const tooltipEl = document.getElementById("tooltip");
let tooltipTimer = null;
function showTooltip(el, text) {
  if (expandedId) return;
  clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(() => {
    const r = el.getBoundingClientRect();
    tooltipEl.textContent = text;
    tooltipEl.style.left = (r.left + r.width / 2) + "px";
    tooltipEl.style.top = r.top + "px";
    tooltipEl.classList.add("show");
  }, 90);
}
function hideTooltip() {
  clearTimeout(tooltipTimer);
  tooltipEl.classList.remove("show");
}
const api = (url, body) => fetch(url, { method:"POST",
  headers:{ "Content-Type":"application/json", "X-BranchPort":"1" }, body: JSON.stringify(body) }).then(r => r.json());

let TURNS = [], byId = {}, parentOf = {}, LABELS = {};
// LLM 제목·요약 — 없으면 서버가 만든 headline(프롬프트 절단)으로 폴백
const labelOf = t => LABELS[t.hash];
const titleOf = t => labelOf(t)?.t ?? t.headline;
const tipText = t => { const lb = labelOf(t); return lb ? lb.t + "\n" + lb.g : t.headline; };
let CURRENT_PROJECT = null;
let selA = null, selB = null, expandedId = null, PKG = null;
let LAST_POS = {}, NODE_EL = {}, CONTENT_W = 0, CONTENT_H = 0, KIDS = {};

function hideSplash() {
  const el = document.getElementById("splash");
  if (!el) return;
  el.classList.add("hide");
  setTimeout(() => el.remove(), 550);
}

// the diagram's own draw-in choreography runs ~2.65s (see #splash markup delays) —
// hold the splash at least that long even when data loads instantly, so the
// animation is never cut short on a fast local fetch.
const MIN_SPLASH_MS = 2900;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function loadProjects() {
  const splashHold = sleep(MIN_SPLASH_MS);
  const sel = document.getElementById("project-select");
  try {
    const projects = await fetch("/api/projects").then(r => r.json());
    sel.innerHTML = "";
    if (!projects.length) {
      sel.innerHTML = "<option>세션을 찾을 수 없음</option>";
      return;
    }
    for (const p of projects) {
      const opt = document.createElement("option");
      opt.value = p.dirName; opt.textContent = `${p.displayPath} (${p.sessionCount})`;
      sel.appendChild(opt);
    }
    sel.addEventListener("change", () => loadTurns(sel.value));
    await loadTurns(projects[0].dirName);
  } catch (e) {
    // 서버가 죽어 있어도 스플래시 뒤에 갇히지 않도록 — 화면을 열고 오류를 보여준다
    document.getElementById("loading").textContent = "서버에 연결할 수 없습니다. `npm run dev`로 서버를 켠 뒤 새로고침하세요.";
  } finally {
    await splashHold;
    hideSplash();
  }
}

let LAST_FP = ""; // 마지막 렌더의 턴 지문 — 내용이 같으면 조용한 갱신은 화면을 건드리지 않는다
async function loadTurns(project, opts = {}) {
  if (CURRENT_PROJECT !== project) { lastMtime = 0; LAST_FP = ""; } // 프로젝트가 바뀌면 갱신 기준점 리셋
  CURRENT_PROJECT = project;
  const loading = document.getElementById("loading");
  if (!opts.silent) {
    loading.textContent = "불러오는 중…";
    expandedId = null; // a node id from the previous project would otherwise dim the whole new tree
    clearSel();
  }
  const data = await fetch(`/api/turns?project=${encodeURIComponent(project)}`).then(r => r.json());
  if (data.error) { loading.textContent = "오류: " + data.error; return; }
  await fetchBranches(project);
  if (!opts.silent) loading.textContent = "";
  const nextParentOf = {}, flat = [];
  (function walk(nodes, parentId) {
    for (const n of nodes) { flat.push(n); nextParentOf[n.id] = parentId; walk(n.children, n.id); }
  })(data.turns, null);
  // 세션 파일은 메타 기록만으로도 계속 바뀌므로, 실제 턴 내용이 그대로면 재렌더하지 않는다
  // (팝인·선 그리기 애니메이션이 주기적으로 재생되는 문제 방지)
  const fp = flat.map(t => t.hash).join(",");
  if (opts.silent && fp === LAST_FP) return;
  LAST_FP = fp;
  parentOf = nextParentOf;
  TURNS = flat;
  byId = Object.fromEntries(flat.map(t => [t.id, t]));
  document.getElementById("meta").textContent =
    `턴 ${flat.length} · 노드 ${data.stats.keptNodes} · 라인 ${data.stats.totalLines} · 파싱오류 ${data.stats.parseErrors}`;
  NOANIM = KEEP_CAMERA = !!opts.silent; // 조용한 갱신은 등장 애니메이션·카메라 이동 없이 제자리 갱신
  render();
  NOANIM = false;
  refreshLabels(project);
}

// ── LLM 제목·요약: 캐시 조회 → 미라벨 턴이 있으면 배치 생성 요청, 도착분 즉시 반영 ──
function applyLabels() {
  document.querySelectorAll(".node-label").forEach(el => {
    const t = byId[el.dataset.id];
    if (t) el.textContent = titleOf(t);
  });
}
async function fetchLabels(project) {
  const j = await fetch(`/api/labels?project=${encodeURIComponent(project)}`).then(r => r.json());
  return j.labels || {};
}
async function refreshLabels(project) {
  const loading = document.getElementById("loading");
  try {
    LABELS = await fetchLabels(project);
    if (project !== CURRENT_PROJECT) return;
    applyLabels();
    for (let guard = 0; guard < 20; guard++) {
      if (!TURNS.some(t => !LABELS[t.hash])) break;
      loading.textContent = "제목 생성 중…";
      const r = await api("/api/label", { project });
      if (project !== CURRENT_PROJECT) return;
      if (r.error || r.busy || !r.labeled) break;
      LABELS = await fetchLabels(project);
      if (project !== CURRENT_PROJECT) return;
      applyLabels();
      if (!r.remaining) break;
    }
  } catch { /* 라벨은 장식층 — 실패해도 트리는 그대로 동작 */ }
  if (project === CURRENT_PROJECT && loading.textContent === "제목 생성 중…") loading.textContent = "";
}

const COLW = 108, LANEH = 70, PADX = 60, PADY = 60;
const tileSide = t => Math.round(Math.min(30, Math.max(16, 16 + 1.4 * Math.log2(1 + t.outputTokens / 800))));
const fmtGap = m => m >= 60 ? (Math.round(m/6)/10) + "h" : m + "m";
const fmtTok = n => n >= 1000 ? (Math.round(n/100)/10) + "k" : n;

function render() {
  document.getElementById("empty").style.display = TURNS.length ? "none" : "flex";
  const map = document.getElementById("map");
  map.classList.toggle("noanim", NOANIM);
  map.querySelectorAll(".node,.seam,.node-label").forEach(e => e.remove());
  const svg = document.getElementById("links");
  svg.innerHTML = "";
  NODE_EL = {};
  if (!TURNS.length) return;

  const kids = {};
  TURNS.forEach(t => { (kids[parentOf[t.id]] ??= []).push(t); });
  KIDS = kids; // exposed for arrow-key navigation
  const roots = TURNS.filter(t => parentOf[t.id] === null);

  let laneCounter = 0;
  const pos = {};
  function assign(t, depth, lane) {
    pos[t.id] = { lane, depth };
    const cs = kids[t.id] || [];
    cs.forEach((c, i) => { if (i === 0) assign(c, depth + 1, lane); else assign(c, depth + 1, ++laneCounter); });
  }
  roots.forEach((r, i) => { const lane = i === 0 ? laneCounter : ++laneCounter; assign(r, 0, lane); });

  const X = id => PADX + pos[id].depth * COLW;
  const Y = id => PADY + pos[id].lane * LANEH;
  const maxLane = Math.max(...Object.values(pos).map(p => p.lane));
  const maxDepth = Math.max(...Object.values(pos).map(p => p.depth));
  CONTENT_W = PADX * 2 + maxDepth * COLW;
  CONTENT_H = PADY * 2 + maxLane * LANEH;
  map.style.width = CONTENT_W + "px";
  map.style.height = CONTENT_H + "px";
  svg.setAttribute("width", CONTENT_W); svg.setAttribute("height", CONTENT_H);
  svg.setAttribute("viewBox", `0 0 ${CONTENT_W} ${CONTENT_H}`);

  LAST_POS = pos;

  TURNS.forEach(t => {
    const pid = parentOf[t.id];
    if (pid === null || !byId[pid]) return;
    const x1 = X(pid), y1 = Y(pid), x2 = X(t.id), y2 = Y(t.id);
    let d;
    if (y1 === y2) d = `M ${x1} ${y1} L ${x2} ${y2}`;
    else {
      const mx = x1 + (x2 - x1) * 0.5;
      const s = Math.sign(y2 - y1);
      d = `M ${x1} ${y1} L ${mx - 14} ${y1} Q ${mx} ${y1} ${mx} ${y1 + s*14} L ${mx} ${y2 - s*14} Q ${mx} ${y2} ${mx+14} ${y2} L ${x2} ${y2}`;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("class", "link");
    p.dataset.from = pid; p.dataset.to = t.id;
    svg.appendChild(p);

    const marks = [];
    if (t.compactBefore) marks.push("⑊");
    if ((t.gapMin || 0) >= 30) marks.push("⋯" + fmtGap(t.gapMin));
    if (marks.length) {
      const s = document.createElement("div");
      s.className = "seam"; s.textContent = marks.join(" ");
      s.style.left = ((x1+x2)/2) + "px"; s.style.top = ((y1+y2)/2 - 12) + "px";
      map.appendChild(s);
    }
  });

  TURNS.forEach((t, i) => {
    const side = tileSide(t);
    const n = document.createElement("div");
    n.className = "node" + (t.delegated ? " deleg" : "") + (t.hasError ? " err" : "");
    n.style.setProperty("--pc", `var(--${t.phase})`);
    n.style.left = X(t.id) + "px"; n.style.top = Y(t.id) + "px";
    n.style.width = side + "px"; n.style.height = side + "px";
    n.style.animationDelay = Math.min(i * 10, 450) + "ms";
    n.dataset.id = t.id;
    n.innerHTML = nodeBaseHtml(t);
    n.addEventListener("mouseenter", () => showTooltip(n, tipText(t)));
    n.addEventListener("mouseleave", hideTooltip);
    n.addEventListener("click", (ev) => {
      ev.stopPropagation();
      hideTooltip();
      if (ev.shiftKey && selA !== null) trySetRangeEnd(t.id);
      else selectNode(t.id);
    });
    map.appendChild(n);
    NODE_EL[t.id] = n;

    const lbl = document.createElement("div");
    lbl.className = "node-label" + (t.isForkRoot ? " fork" : "");
    lbl.textContent = titleOf(t);
    lbl.style.left = X(t.id) + "px"; lbl.style.top = (Y(t.id) + side / 2 + 5) + "px";
    lbl.style.animationDelay = Math.min(i * 10, 450) + 60 + "ms";
    lbl.dataset.id = t.id;
    map.appendChild(lbl);
  });

  applySelectionClasses();
  // animated (not instant) — the camera zooming out to reveal the whole tree is the intended entrance effect
  requestAnimationFrame(() => {
    if (KEEP_CAMERA) { KEEP_CAMERA = false; applyTransform(camTx, camTy, camScale, true); }
    else if (expandedId && byId[expandedId]) focusOn(expandedId);
    else fitAll();
  });
}

// ── 자동 갱신: 세션 파일 변화를 폴링, 새 턴이 생기면 조용히 반영 ──
// silent 갱신은 ① 턴 내용이 그대로면 아무것도 안 하고 ② 바뀌었을 때만
// 애니메이션·카메라 이동 없이 제자리 갱신한다.
let lastMtime = 0, KEEP_CAMERA = false, NOANIM = false;
setInterval(async () => {
  if (!CURRENT_PROJECT || document.hidden) return;
  // 카드·모달·범위 선택 중엔 보류 — 보고 있는 화면을 갈아엎지 않는다
  if (expandedId || selA !== null || modal.classList.contains("open")) return;
  try {
    const j = await fetch(`/api/mtime?project=${encodeURIComponent(CURRENT_PROJECT)}`).then(r => r.json());
    if (!j.mtime || j.mtime === lastMtime) { lastMtime = j.mtime || lastMtime; return; }
    const firstObservation = !lastMtime; // 기준값만 기록, 재로드는 실제 변화부터
    lastMtime = j.mtime;
    if (!firstObservation) await loadTurns(CURRENT_PROJECT, { silent: true });
  } catch { /* 서버 재시작 등 일시 오류 무시 */ }
}, 10_000);

// ── camera: transform-based pan/zoom instead of native scrolling ──
const viewport = document.getElementById("viewport");
const stage = document.getElementById("stage");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let atHome = true;
let camScale = 1, camTx = 0, camTy = 0;
// a tree too large to fully fit stays readable instead of being crammed down
// to an unreadable scale — drag/wheel below cover the part that then falls
// outside the initial view.
const MIN_FIT_SCALE = 0.42, MIN_ZOOM = 0.12, MAX_ZOOM = 2.4;

function applyTransform(tx, ty, scale, instant) {
  camTx = tx; camTy = ty; camScale = scale;
  viewport.classList.toggle("instant", !!instant);
  viewport.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  if (instant) void viewport.offsetHeight;
  viewport.classList.remove("instant");
}
function fitAll(instant) {
  const r = stage.getBoundingClientRect();
  const rawFit = Math.min((r.width - 90) / CONTENT_W, (r.height - 90) / CONTENT_H);
  const scale = clamp(rawFit, MIN_FIT_SCALE, 1.3);
  const tx = (r.width - CONTENT_W * scale) / 2;
  const ty = (r.height - CONTENT_H * scale) / 2;
  applyTransform(tx, ty, scale, instant);
  atHome = true;
  document.getElementById("home-btn").classList.remove("show");
}
const EXPAND_SCALE = 0.85; // fixed, so a click always lands dead-center at a predictable, tested zoom
function focusOn(id, instant) {
  const p = LAST_POS[id]; if (!p) return;
  const r = stage.getBoundingClientRect();
  const x = PADX + p.depth * COLW, y = PADY + p.lane * LANEH;
  applyTransform(r.width / 2 - x * EXPAND_SCALE, r.height / 2 - y * EXPAND_SCALE, EXPAND_SCALE, instant);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
}
document.getElementById("home-btn").addEventListener("click", homeView);
// background click / × just closes the card — it must NOT also reset the camera,
// only the dedicated "전체 보기" button does that
stage.addEventListener("click", () => { if (expandedId && !justDragged) closeExpanded(); });
function closeExpanded() {
  if (expandedId) collapseNode(expandedId);
}
function homeView() {
  closeExpanded();
  fitAll();
}

// manual pan (drag) + wheel/trackpad zoom, so a tree that doesn't fully fit
// the "전체 보기" scale is still fully reachable
let panState = null, justDragged = false;
stage.addEventListener("pointerdown", (e) => {
  if (expandedId || e.target.closest(".node")) return;
  panState = { x: e.clientX, y: e.clientY, tx: camTx, ty: camTy, moved: false };
  stage.classList.add("panning");
});
window.addEventListener("pointermove", (e) => {
  if (!panState) return;
  const dx = e.clientX - panState.x, dy = e.clientY - panState.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panState.moved = true;
  applyTransform(panState.tx + dx, panState.ty + dy, camScale, true);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
});
window.addEventListener("pointerup", () => {
  if (panState?.moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 50); }
  panState = null;
  stage.classList.remove("panning");
});
stage.addEventListener("wheel", (e) => {
  if (expandedId) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const factor = Math.exp(-e.deltaY * 0.0012);
  const newScale = clamp(camScale * factor, MIN_ZOOM, MAX_ZOOM);
  const mapX = (cx - camTx) / camScale, mapY = (cy - camTy) / camScale;
  applyTransform(cx - mapX * newScale, cy - mapY * newScale, newScale, true);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
}, { passive: false });

// ── selection / expansion ──
function selectNode(id) {
  selA = id; selB = null; updateSel();
  if (expandedId && expandedId !== id) collapseNode(expandedId);
  // focus first so camScale already holds its final value — expandNode reads
  // it to counter-scale the card, so the order here matters
  focusOn(id);
  expandNode(id);
  applySelectionClasses();
}
function expandNode(id) {
  const t = byId[id]; const el = NODE_EL[id]; if (!t || !el) return;
  hideTooltip();
  expandedId = id;
  // counter the ambient camera zoom so the card always renders at the same
  // on-screen size (its width/height are set in viewport units in CSS) —
  // instead of ballooning when the camera happens to be zoomed in
  el.style.transform = `translate(-50%,-50%) scale(${1 / camScale})`;
  el.innerHTML = `<button class="d-close" onclick="event.stopPropagation(); closeExpanded()">×</button><div class="detail">${detailHtml(t)}</div><span class="icon">${GLYPH[t.phase]}</span>`;
  requestAnimationFrame(() => el.classList.add("expanded"));
}
function collapseNode(id) {
  const t = byId[id]; const el = NODE_EL[id]; if (!t || !el) return;
  el.classList.remove("expanded");
  el.style.transform = "";
  expandedId = null;
  setTimeout(() => { if (!el.classList.contains("expanded")) el.innerHTML = nodeBaseHtml(t); }, 380);
}
function detailHtml(t) {
  const dur = t.endTimestamp && t.timestamp ? Math.round((Date.parse(t.endTimestamp) - Date.parse(t.timestamp)) / 60000) : 0;
  const chips = [PHASE[t.phase], `도구 ${t.toolCount}`, `${t.outputTokens.toLocaleString()} tok`];
  if (dur >= 1) chips.push(fmtGap(dur));
  if (t.delegated) chips.push("위임");
  if (t.interrupted) chips.push("중단됨");
  if (t.hasImage) chips.push("이미지");
  return `
    ${t.isForkRoot ? `<div class="d-fork">포크 · ${esc(t.forkName ?? "")}</div>` : ""}
    <div class="d-title">${esc(titleOf(t))}</div>
    ${labelOf(t) ? `<div class="d-gist">${esc(labelOf(t).g)}</div>` : ""}
    <div class="d-meta">${t.timestamp ? new Date(t.timestamp).toLocaleString("ko-KR") : ""}</div>
    <div class="d-chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}${t.hasError ? `<span class="chip err">⚠ 에러 포함</span>` : ""}</div>
    <div class="d-msg user">${esc(t.prompt)}</div>
    <div class="d-msg ai">${esc(t.answer || "(도구 작업만 수행)")}</div>
    <div class="d-h">도구 내역</div>
    <ul class="d-list">${t.tools.map(x => `<li>${esc(x.name)}${x.inputPreview ? " · " + esc(x.inputPreview) : ""}${x.isError ? " ⚠" : ""}</li>`).join("") || "<li>없음</li>"}</ul>
    <div class="d-h">만진 파일</div>
    <ul class="d-list">${t.files.map(x => `<li>${esc(x)}</li>`).join("") || "<li>없음</li>"}</ul>
    <div class="d-h">갈래 대화</div>
    <div id="br-area">${brListHtml(t)}</div>`;
}

// ── 갈래(브랜치) 대화: 이 턴 시점의 맥락만 아는 AI와 나누는 곁가지 대화 ──
let BRANCHES = [];
const branchesFor = id => BRANCHES.filter(b => b.turnId === id);
const nodeBaseHtml = t => {
  const nbr = branchesFor(t.id).length;
  return `<span class="icon">${GLYPH[t.phase]}</span>` + (nbr ? `<span class="brb">⑂${nbr}</span>` : "");
};
async function fetchBranches(project) {
  try {
    const j = await fetch(`/api/branches?project=${encodeURIComponent(project)}`).then(r => r.json());
    if (project === CURRENT_PROJECT) BRANCHES = j.branches || [];
  } catch { /* 갈래는 부가층 — 실패해도 트리는 동작 */ }
}
function refreshNodeBadge(turnId) {
  const el = NODE_EL[turnId], t = byId[turnId];
  if (el && t && !el.classList.contains("expanded")) el.innerHTML = nodeBaseHtml(t);
}
function brListHtml(t) {
  const chips = branchesFor(t.id).map(b =>
    `<button class="brchip" onclick="event.stopPropagation(); openBranch('${esc(b.id)}')">⑂ ${esc(b.title)} · ${Math.floor(b.messages.length / 2)}</button>`).join("");
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">${chips}
    <button class="brchip" onclick="event.stopPropagation(); createBranch('${esc(t.id)}')">＋ 새 갈래</button></div>`;
}
function backToBranchList(turnId) {
  const area = document.getElementById("br-area"), t = byId[turnId];
  if (area && t) area.innerHTML = brListHtml(t);
}
async function createBranch(turnId) {
  try {
    const t = byId[turnId];
    const br = await api("/api/branch-create", { project: CURRENT_PROJECT, kind: "node", turnId, title: titleOf(t).slice(0, 40) });
    if (br.error) throw new Error(br.error);
    BRANCHES.push(br);
    openBranch(br.id);
  } catch (e) { alert("갈래 생성 실패: " + e.message); }
}
function openBranch(id) {
  const br = BRANCHES.find(b => b.id === id); if (!br) return;
  const area = document.getElementById("br-area"); if (!area) return;
  area.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="brchip" onclick="event.stopPropagation(); backToBranchList('${esc(br.turnId)}')">←</button>
      <b style="font-size:12.5px">⑂ ${esc(br.title)}</b>
      <span style="font-size:11px;color:var(--muted)">${br.kind === "compact" ? "압축 패키지만 아는 AI" : "이 시점까지만 아는 AI"}</span>
    </div>
    <div class="br-msgs" id="br-msgs">${br.messages.map(m => `<div class="br-msg ${m.role === "user" ? "user" : "ai"}">${esc(m.text)}</div>`).join("")}</div>
    <div class="br-input">
      <input id="br-q" placeholder="이 시점의 AI에게 질문…" onclick="event.stopPropagation()"
        onkeydown="if(event.key==='Enter')sendBranchMsg('${esc(br.id)}')">
      <button class="btn primary" onclick="event.stopPropagation(); sendBranchMsg('${esc(br.id)}')">보내기</button>
    </div>`;
  const msgs = document.getElementById("br-msgs");
  if (msgs) msgs.scrollTop = 1e9;
}
async function sendBranchMsg(id) {
  const input = document.getElementById("br-q"); if (!input) return;
  const q = input.value.trim(); if (!q) return;
  input.value = "";
  const msgs = document.getElementById("br-msgs");
  // 응답 대기 중 다른 갈래/카드로 이동할 수 있으므로 보낸 시점의 대상을 캡처(오귀속 방지)
  const sentId = id, sentProject = CURRENT_PROJECT, sentMsgs = msgs;
  const optimistic = document.createElement("div"); optimistic.className = "br-msg user"; optimistic.textContent = q;
  const pending = document.createElement("div"); pending.className = "br-msg ai"; pending.textContent = "…생각 중 (최대 3분)";
  if (msgs) { msgs.append(optimistic, pending); msgs.scrollTop = 1e9; }
  try {
    const j = await api("/api/branch-chat", { project: sentProject, id: sentId, question: q });
    if (j.error) throw new Error(j.error);
    const i = BRANCHES.findIndex(b => b.id === sentId);
    if (i >= 0) BRANCHES[i] = j.branch;
    if (document.getElementById("br-msgs") === sentMsgs) {
      pending.textContent = j.answer;
      sentMsgs.scrollTop = 1e9;
    }
  } catch (e) {
    optimistic.remove(); pending.remove(); // 낙관 메시지 롤백
    const inp = document.getElementById("br-q");
    if (inp) inp.value = q;
    alert("갈래 대화 실패: " + e.message);
  }
}

function pathToRoot(id) { const p = []; let cur = id; while (cur) { p.unshift(cur); cur = parentOf[cur]; } return p; }
function trySetRangeEnd(id) {
  const pa = pathToRoot(selA), pb = pathToRoot(id);
  if (pa.includes(id)) { selB = selA; selA = id; }
  else if (pb.includes(selA)) { selB = id; }
  else { selectNode(id); return; }
  updateSel(); applySelectionClasses();
}
function rangeIds() {
  if (selA === null) return [];
  if (selB === null) return [selA];
  const full = pathToRoot(selB);
  const i = full.indexOf(selA);
  return i >= 0 ? full.slice(i) : [selA, selB];
}
// expanding a node used to dim everything off its path to root — removed per
// feedback: the rest of the tree should stay fully visible/colored regardless
// of what's expanded. Only range-selection highlighting and hiding the
// expanded node's own (now-redundant) label remain.
function applySelectionClasses() {
  const range = new Set(rangeIds());
  for (const [id, el] of Object.entries(NODE_EL)) {
    el.classList.toggle("selected", range.has(id));
  }
  document.querySelectorAll(".link").forEach(el => {
    const onSelPath = range.has(el.dataset.from) && range.has(el.dataset.to);
    el.classList.toggle("path", onSelPath);
  });
  document.querySelectorAll(".node-label").forEach(el => {
    el.classList.toggle("hide-self", expandedId === el.dataset.id);
  });
}
// the banner shows the instant Shift goes down (a hint, before any range
// exists yet) and switches to the live count once shift+click has actually
// picked a second turn — it only fully leaves once both are false
let shiftHeld = false;
function updateSel() {
  const bar = document.getElementById("selbar");
  const countEl = document.getElementById("sb-n");
  const n = rangeIds().length;
  const active = n > 1;
  bar.classList.toggle("active", active);
  if (active && countEl.textContent !== String(n)) {
    countEl.textContent = n;
    countEl.classList.remove("bump"); void countEl.offsetWidth; countEl.classList.add("bump");
  }
  bar.classList.toggle("on", shiftHeld || active);
}
// arrow keys walk the tree from the currently selected turn: →/← are
// child/parent (forward/back in time), ↑/↓ cycle between sibling branches
// (parallel turns off the same parent — including switching root sessions).
// Reusing selectNode() for the target means an already-open popup collapses
// and the new one grows at the same time as the camera pans, instead of
// closing fully before the next one opens.
const ARROW_DIR = { ArrowRight: "right", ArrowLeft: "left", ArrowUp: "up", ArrowDown: "down" };
function navigateArrow(dir) {
  if (selA === null) return;
  let target = null;
  if (dir === "right") {
    const children = KIDS[selA] || [];
    if (children.length) target = children[0].id;
  } else if (dir === "left") {
    const p = parentOf[selA];
    if (p) target = p;
  } else {
    const siblings = KIDS[parentOf[selA]] || [];
    const idx = siblings.findIndex(s => s.id === selA);
    if (idx >= 0) {
      const nextIdx = dir === "up" ? idx - 1 : idx + 1;
      if (nextIdx >= 0 && nextIdx < siblings.length) target = siblings[nextIdx].id;
    }
  }
  if (target) selectNode(target);
}
window.addEventListener("keydown", (e) => {
  if (e.key === "Shift" && !shiftHeld) { shiftHeld = true; updateSel(); }
  if (e.key === "Escape") {
    if (modal.classList.contains("open")) modal.classList.remove("open");
    else if (expandedId) closeExpanded();
    return;
  }
  const dir = ARROW_DIR[e.key];
  if (dir && !["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
    e.preventDefault();
    navigateArrow(dir);
  }
});
window.addEventListener("keyup", (e) => {
  if (e.key === "Shift" && shiftHeld) { shiftHeld = false; updateSel(); }
});
window.addEventListener("blur", () => {
  if (shiftHeld) { shiftHeld = false; updateSel(); } // e.g. alt-tabbing away while held
});
function clearSel() { selA = selB = null; updateSel(); applySelectionClasses(); }
document.getElementById("sb-clear").addEventListener("click", (ev) => { ev.stopPropagation(); clearSel(); });

document.getElementById("sb-go").addEventListener("click", async (ev) => {
  ev.stopPropagation();
  const btn = document.getElementById("sb-go");
  const ids = rangeIds();
  btn.disabled = true; btn.textContent = "생성 중… (최대 3분)";
  try {
    const j = await api("/api/compact", { project: CURRENT_PROJECT, turnIds: ids, purpose: document.getElementById("sb-purpose").value || undefined });
    if (j.error) throw new Error(j.error);
    PKG = j;
    document.getElementById("m-meta").textContent = `${ids.length}턴 · 파일 저장됨: ${j.savedTo}`;
    showTab("md");
    document.getElementById("modal").classList.add("open");
  } catch (e) { alert("압축 실패: " + e.message); }
  btn.disabled = false; btn.textContent = "압축 패키지 생성";
});
function showTab(k) {
  document.getElementById("tab-md").classList.toggle("on", k === "md");
  document.getElementById("tab-json").classList.toggle("on", k === "json");
  document.getElementById("m-pre").textContent = k === "md" ? PKG.md : JSON.stringify(PKG.json, null, 2);
}
document.getElementById("tab-md").addEventListener("click", () => showTab("md"));
document.getElementById("tab-json").addEventListener("click", () => showTab("json"));
document.getElementById("m-copy").addEventListener("click", () => navigator.clipboard.writeText(document.getElementById("m-pre").textContent));
document.getElementById("m-branch").addEventListener("click", async () => {
  const btn = document.getElementById("m-branch");
  try {
    const ids = rangeIds();
    const anchor = ids[ids.length - 1]; // 선택 경로의 마지막 턴에 갈래를 매단다
    if (!anchor || !PKG?.pkgFile) throw new Error("패키지 정보가 없습니다");
    btn.disabled = true;
    const br = await api("/api/branch-create", {
      project: CURRENT_PROJECT, kind: "compact", turnId: anchor,
      pkgFile: PKG.pkgFile, title: "압축 갈래 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }),
    });
    if (br.error) throw new Error(br.error);
    BRANCHES.push(br);
    modal.classList.remove("open");
    selectNode(anchor);   // 앵커 턴 카드를 열고
    openBranch(br.id);    // 바로 갈래 채팅으로 진입
  } catch (e) { alert("갈래 생성 실패: " + e.message); }
  btn.disabled = false;
});
document.getElementById("m-dl-md").addEventListener("click", () => download("md"));
document.getElementById("m-dl-json").addEventListener("click", () => download("json"));
function download(kind) {
  const content = kind === "md" ? PKG.md : JSON.stringify(PKG.json, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: "text/plain" }));
  a.download = `branchport-package.${kind}`;
  a.click(); URL.revokeObjectURL(a.href);
}

window.addEventListener("resize", () => { if (!expandedId) fitAll(true); });
loadProjects();
</script>
