let TURNS = [], byId = {}, parentOf = {}, LABELS = {}, HUMAN_SESS = new Set();
// LLM 제목·요약. 라벨이 아직 없으면 원문 절단을 "임시 표시" 스타일(흐림·기울임)로
// 보여주고, 라벨이 도착하는 대로 교체한다 — 화면을 "…"로 비우면 고장처럼 보인다.
let LABELING = true;
const labelOf = t => LABELS[t.hash];
const titleOf = t => labelOf(t)?.t ?? t.headline;
// 라벨 대기 중(임시 표시) 여부 — 생성 불가로 판명(LABELING=false)되면 흐림 표시도 해제
const isProv = t => !labelOf(t) && !t._pseudo && LABELING;
const tipText = t => {
  const lb = labelOf(t);
  if (lb) return lb.t + "\n" + lb.g;
  return t.headline + (isProv(t) && LABELING ? "\n(제목·요약 생성 중…)" : "");
};
let CURRENT_PROJECT = null;
let selA = null, selB = null, expandedId = null, PKG = null;
// 선택 하이라이트는 shift로 '범위를 집는' 동안에만 보여준다. 그냥 클릭은 카드를
// 여는 동작일 뿐인데, 여기에 초록 테두리+틴트를 씌우면 노드 고유의 국면색을 가린다.
let selShift = false;
let LAST_POS = {}, NODE_EL = {}, CONTENT_W = 0, CONTENT_H = 0, KIDS = {};
// 세션 뷰 상태: undefined=아직 미정(최신 세션으로), null=전체 트리, 문자열=해당 세션만
let LAST_XY = {}, SESSION_SCOPE = undefined, CRUMBS = [], EXPANDED_CAPS = new Set();
let VIEW_SESS = [], CAP_OF = {}, SKIP_OF = {};
// 갈래 워프 뷰 상태: 갈래 id가 있으면 그 갈래 대화를 세션처럼 노드 선으로 렌더
let BRANCH_SCOPE = null, PENDING_BR = null, BR_LAST_ID = null;

function hideSplash() {
  const el = document.getElementById("splash");
  if (!el) return;
  el.classList.add("hide");
  setTimeout(() => el.remove(), 550);
}

// the diagram's own draw-in choreography runs ~2.65s (see #splash markup delays) —
// hold the splash at least that long even when data loads instantly, so the
// animation is never cut short on a fast local fetch.
const MIN_SPLASH_MS = 2900;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function loadProjects() {
  const splashHold = sleep(MIN_SPLASH_MS);
  const sel = document.getElementById("project-select");
  try {
    const projects = await fetch("/api/projects").then(r => r.json());
    sel.innerHTML = "";
    if (!projects.length) {
      sel.innerHTML = "<option>세션을 찾을 수 없음</option>";
      return;
    }
    for (const p of projects) {
      const opt = document.createElement("option");
      opt.value = p.dirName; opt.textContent = `${p.displayPath} (${p.sessionCount})`;
      sel.appendChild(opt);
    }
    sel.addEventListener("change", () => loadTurns(sel.value));
    // 첫 화면 = 가장 최근에 대화한 프로젝트 (목록 첫 항목이 아니라)
    let initial = projects[0].dirName;
    try {
      const mtimes = await Promise.all(projects.map(p =>
        fetch(`/api/mtime?project=${encodeURIComponent(p.dirName)}`).then(r => r.json()).then(j => j.mtime || 0).catch(() => 0)));
      initial = projects[mtimes.indexOf(Math.max(...mtimes))].dirName;
    } catch { /* 실패하면 첫 항목 */ }
    sel.value = initial;
    await loadTurns(initial);
  } catch (e) {
    // 서버가 죽어 있어도 스플래시 뒤에 갇히지 않도록 — 화면을 열고 오류를 보여준다
    document.getElementById("loading").textContent = "서버에 연결할 수 없습니다. `npm run dev`로 서버를 켠 뒤 새로고침하세요.";
  } finally {
    await splashHold;
    hideSplash();
  }
}

let LAST_FP = ""; // 마지막 렌더의 턴 지문 — 내용이 같으면 조용한 갱신은 화면을 건드리지 않는다
async function loadTurns(project, opts = {}) {
  if (CURRENT_PROJECT !== project) { // 프로젝트가 바뀌면 갱신 기준점·세션 스코프 리셋
    lastMtime = 0; LAST_FP = "";
    SESSION_SCOPE = undefined; CRUMBS = []; EXPANDED_CAPS = new Set();
  }
  CURRENT_PROJECT = project;
  const loading = document.getElementById("loading");
  if (!opts.silent) {
    loading.textContent = "불러오는 중…";
    expandedId = null; // a node id from the previous project would otherwise dim the whole new tree
    clearSel();
  }
  const data = await fetch(`/api/turns?project=${encodeURIComponent(project)}`).then(r => r.json());
  if (project !== CURRENT_PROJECT) return; // 대기 중 다른 프로젝트로 바꿨으면 이 응답은 버린다
  if (data.error) { loading.textContent = "오류: " + data.error; return; }
  await fetchBranches(project);
  if (project !== CURRENT_PROJECT) return;
  if (!opts.silent) loading.textContent = "";
  const nextParentOf = {}, flat = [];
  (function walk(nodes, parentId) {
    for (const n of nodes) { flat.push(n); nextParentOf[n.id] = parentId; walk(n.children, n.id); }
  })(data.turns, null);
  // 세션 파일은 메타 기록만으로도 계속 바뀌므로, 실제 턴 내용이 그대로면 재렌더하지 않는다
  // (팝인·선 그리기 애니메이션이 주기적으로 재생되는 문제 방지)
  const fp = flat.map(t => t.hash).join(",");
  if (opts.silent && fp === LAST_FP) return;
  LAST_FP = fp;
  parentOf = nextParentOf;
  TURNS = flat;
  byId = Object.fromEntries(flat.map(t => [t.id, t]));
  HUMAN_SESS = new Set(data.humanSessions ?? []);
  document.getElementById("meta").textContent =
    `턴 ${flat.length} · 노드 ${data.stats.keptNodes} · 라인 ${data.stats.totalLines} · 파싱오류 ${data.stats.parseErrors}`;
  rebuildSessionSelect();
  NOANIM = KEEP_CAMERA = !!opts.silent; // 조용한 갱신은 등장 애니메이션·카메라 이동 없이 제자리 갱신
  render();
  NOANIM = false;
  refreshLabels(project);
}

// ── LLM 제목·요약: 캐시 조회 → 미라벨 턴이 있으면 배치 생성 요청, 도착분 즉시 반영 ──
function applyLabels() {
  document.querySelectorAll(".node-label").forEach(el => {
    const t = byId[el.dataset.id];
    if (t) { el.textContent = titleOf(t); el.classList.toggle("prov", isProv(t)); }
  });
  let capTitleChanged = false;
  document.querySelectorAll(".cap-t").forEach(el => {
    if (el.dataset.topic) return;             // 주제 캡슐 제목은 확정값 — 라벨 갱신이 덮지 않는다
    const capT = CAP_LABELS[el.dataset.cap];  // 구간 전체 대표 제목이 우선
    const t = byId[el.dataset.id];
    if (!capT && !t) return;
    const next = capT ?? titleOf(t);
    if (el.textContent !== next) capTitleChanged = true;
    el.textContent = next; el.classList.toggle("prov", !capT && t ? isProv(t) : false);
  });
  requestCapsuleLabels();
  const sessions = sessionsOf();
  [...document.getElementById("session-select").options].forEach(o => {
    const s = sessions.find(x => x.id === o.value);
    if (s) o.textContent = sessOptLabel(s);
  });
  // 알약 폭은 렌더 시점의 제목 길이로 정해진다 — 나중에 도착한 LLM 제목이 더 길면
  // 말줄임으로만 남으므로, 제목이 실제로 바뀐 경우에만 제자리 재배치한다
  // 카드가 열려 있거나 범위를 잡는 중이면 건드리지 않는다(재렌더가 그 상태를 날림)
  if (capTitleChanged && SESSION_SCOPE && !BRANCH_SCOPE && !expandedId && selB === null) {
    KEEP_CAMERA = true; NOANIM = true;
    renderSession();
    NOANIM = false;
  }
}
async function fetchLabels(project) {
  const j = await fetch(`/api/labels?project=${encodeURIComponent(project)}`).then(r => r.json());
  return j.labels || {};
}

// ── 캡슐 전체 대표 제목: 화면의 미라벨 캡슐을 모아 배치 요청, 도착분 즉시 반영 ──
let CAP_LABELS = {}, CAP_HASHES = {}, capReqBusy = false;
async function requestCapsuleLabels() {
  if (capReqBusy) return;
  const missing = [...document.querySelectorAll(".cap-t")]
    .map(el => el.dataset.cap)
    .filter(k => k && !CAP_LABELS[k] && CAP_HASHES[k])
    .map(k => ({ key: k, hashes: CAP_HASHES[k] }));
  if (!missing.length) return;
  capReqBusy = true;
  try {
    const j = await api("/api/capsule-label", { project: CURRENT_PROJECT, capsules: missing.slice(0, 20) });
    if (j && j.labels) {
      const before = Object.keys(CAP_LABELS).length;
      Object.assign(CAP_LABELS, j.labels);
      // 새 제목이 실제로 도착했을 때만 재적용 — busy/무변화 응답에서의 재귀 루프 방지
      if (Object.keys(CAP_LABELS).length > before) applyLabels();
    }
  } catch { /* 부가층 — 실패해도 첫 턴 제목으로 동작 */ }
  finally { capReqBusy = false; }
}
let CAP_PROJ = null; // 마지막으로 캡슐 캐시를 받은 프로젝트 — 전환 시에만 등록분 초기화
async function fetchCapsuleLabels(project) {
  try {
    const j = await fetch(`/api/capsule-labels?project=${encodeURIComponent(project)}`).then(r => r.json());
    if (project === CURRENT_PROJECT) {
      CAP_LABELS = j.labels || {};
      if (CAP_PROJ !== project) { CAP_HASHES = {}; CAP_PROJ = project; } // 이전 프로젝트 등록분 누수 방지
    }
  } catch { /* 부가층 */ }
}
async function refreshLabels(project) {
  const loading = document.getElementById("loading");
  let failed = false;
  try {
    await fetchCapsuleLabels(project); // 캡슐 대표 제목 캐시 선로드 — applyLabels가 곧바로 쓴다
    LABELS = await fetchLabels(project);
    if (project !== CURRENT_PROJECT) return;
    applyLabels();
    for (let guard = 0; guard < 20; guard++) {
      if (!TURNS.some(t => !LABELS[t.hash])) break;
      LABELING = true;
      loading.textContent = `제목 생성 중… ${TURNS.filter(t => LABELS[t.hash]).length}/${TURNS.length}`;
      // 지금 보고 있는 세션의 턴부터 우선 라벨링
      const r = await api("/api/label", { project, session: SESSION_SCOPE || undefined });
      if (project !== CURRENT_PROJECT) return;
      if (r.error) { failed = true; break; }
      if (r.busy || !r.labeled) break;
      LABELS = await fetchLabels(project);
      if (project !== CURRENT_PROJECT) return;
      applyLabels();
      if (!r.remaining) break;
    }
  } catch { failed = true; /* 라벨은 장식층 — 실패해도 트리는 그대로 동작 */ }
  if (project !== CURRENT_PROJECT) return;
  if (failed) { LABELING = false; applyLabels(); } // 생성 불가 판명 → 임시 표시 안내 제거
  if (loading.textContent.startsWith("제목 생성 중…")) loading.textContent = "";
}

// 방금 끝난 턴(15→5분 신선 구간)은 라벨링에서 제외되므로, 시간이 지나면 다시 시도
setInterval(() => {
  if (!CURRENT_PROJECT || document.hidden) return;
  if (TURNS.some(t => !LABELS[t.hash])) refreshLabels(CURRENT_PROJECT);
}, 180_000);

const COLW = 108, LANEH = 70, PADX = 60, PADY = 60;
const tileSide = t => Math.round(Math.min(30, Math.max(16, 16 + 1.4 * Math.log2(1 + t.outputTokens / 800))));
const fmtGap = m => m >= 60 ? (Math.round(m/6)/10) + "h" : m + "m";
const fmtTok = n => n >= 1000 ? (Math.round(n/100)/10) + "k" : n;

// 뷰 디스패처: 갈래 워프 > 세션 뷰 > 전체 트리
function render() {
  clearSearch(); // 재렌더 시 검색 흐림 상태가 고아로 남지 않게 — 노드는 새로 그려지므로 항상 초기화
  // 세션 전환으로 주제 배치가 무효가 되면 버튼 상태도 함께 내린다 (배치 자체는 세션 검사로 이미 안전)
  if (TOPIC_ON && SESSION_SCOPE !== TOPIC_SESSION) {
    TOPIC_ON = false;
    document.getElementById("topic-btn").classList.remove("on");
    document.getElementById("topicstrip").innerHTML = "";
  }
  const inBranch = !!BRANCH_SCOPE;
  const inSession = !inBranch && !!SESSION_SCOPE;
  document.getElementById("chapterbar").classList.toggle("on", inSession && TURNS.length > 0);
  document.getElementById("branchbar").classList.toggle("on", inBranch);
  // 하단 바가 떠 있을 때는 왼쪽 하단 힌트 문구를 숨김(겹침 방지)
  document.body.classList.toggle("hasbar", inSession || inBranch);
  renderCrumbs();
  if (inBranch) renderBranchView();
  else if (inSession) renderSession();
  else renderTree();
}

function renderTree() {
  const map = document.getElementById("map");
  map.classList.toggle("noanim", NOANIM);
  map.querySelectorAll(".node,.seam,.node-label,.capsule,.cap-collapse,.skip,.portal,.cap-region,.topic-band,.topic-rowhdr").forEach(e => e.remove());
  map.classList.remove("searching"); // 노드가 새로 그려지므로 검색 흐림도 함께 해제
  const svg = document.getElementById("links");
  svg.innerHTML = "";
  NODE_EL = {};

  // 필터가 켜지면 걸러진 노드를 트리에서 빼고, 남은 노드를 가장 가까운 살아있는
  // 조상에 다시 잇는다. 사이에 접힌 개수는 그 이음선에 +N으로 적는다.
  // 세션 뷰처럼 한 줄로 접지 않는 이유 — 가지가 여러 갈래라 "사이 구간"이 선형이 아니다.
  const filtering = PHASE_FILTER.size > 0;
  const keep = t => !filtering || PHASE_FILTER.has(t.phase);
  const VT = filtering ? TURNS.filter(keep) : TURNS;
  const vparent = {}, vskip = {};
  for (const t of VT) {
    let p = parentOf[t.id] ?? null, n = 0;
    while (p && byId[p] && !keep(byId[p])) { n++; p = parentOf[p] ?? null; }
    vparent[t.id] = (p && byId[p]) ? p : null;
    vskip[t.id] = n;
  }
  document.getElementById("empty").style.display = VT.length ? "none" : "flex";
  if (!VT.length) return;

  const kids = {};
  VT.forEach(t => { (kids[vparent[t.id]] ??= []).push(t); });
  KIDS = kids; // exposed for arrow-key navigation
  const roots = VT.filter(t => vparent[t.id] === null);

  let laneCounter = 0;
  const pos = {};
  function assign(t, depth, lane) {
    pos[t.id] = { lane, depth };
    const cs = kids[t.id] || [];
    cs.forEach((c, i) => { if (i === 0) assign(c, depth + 1, lane); else assign(c, depth + 1, ++laneCounter); });
  }
  roots.forEach((r, i) => { const lane = i === 0 ? laneCounter : ++laneCounter; assign(r, 0, lane); });

  const X = id => PADX + pos[id].depth * COLW;
  const Y = id => PADY + pos[id].lane * LANEH;
  const maxLane = Math.max(...Object.values(pos).map(p => p.lane));
  const maxDepth = Math.max(...Object.values(pos).map(p => p.depth));
  CONTENT_W = PADX * 2 + maxDepth * COLW;
  CONTENT_H = PADY * 2 + maxLane * LANEH;
  map.style.width = CONTENT_W + "px";
  map.style.height = CONTENT_H + "px";
  svg.setAttribute("width", CONTENT_W); svg.setAttribute("height", CONTENT_H);
  svg.setAttribute("viewBox", `0 0 ${CONTENT_W} ${CONTENT_H}`);

  LAST_POS = pos;
  LAST_XY = {};
  VT.forEach(t => { LAST_XY[t.id] = { x: X(t.id), y: Y(t.id) }; });

  VT.forEach(t => {
    const pid = vparent[t.id];
    if (pid === null || !byId[pid]) return;
    const x1 = X(pid), y1 = Y(pid), x2 = X(t.id), y2 = Y(t.id);
    let d;
    if (y1 === y2) d = `M ${x1} ${y1} L ${x2} ${y2}`;
    else {
      const mx = x1 + (x2 - x1) * 0.5;
      const s = Math.sign(y2 - y1);
      d = `M ${x1} ${y1} L ${mx - 14} ${y1} Q ${mx} ${y1} ${mx} ${y1 + s*14} L ${mx} ${y2 - s*14} Q ${mx} ${y2} ${mx+14} ${y2} L ${x2} ${y2}`;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const nSkip = vskip[t.id] || 0;
    p.setAttribute("d", d);
    p.setAttribute("class", "link" + (nSkip ? " skipline" : ""));
    p.dataset.from = pid; p.dataset.to = t.id;
    svg.appendChild(p);

    const marks = [];
    if (t.compactBefore) marks.push("⑊");
    if ((t.gapMin || 0) >= 30) marks.push("⋯" + fmtGap(t.gapMin));

    // 이 이음선 하나가 접어 삼킨 노드 수 — 세션 뷰의 +N 칩과 같은 표기.
    // ⑊/⋯ 표시가 같은 선에 있으면 그 아래로 비켜 놓는다(둘 다 선 한가운데라 겹침)
    if (nSkip) {
      const c = document.createElement("div");
      c.className = "skip static";
      c.textContent = "+" + nSkip;
      c.style.left = ((x1 + x2) / 2) + "px";
      c.style.top = ((y1 + y2) / 2 + (marks.length ? 15 : 0)) + "px";
      const hidden = [];
      for (let q = parentOf[t.id]; q && byId[q] && !keep(byId[q]); q = parentOf[q] ?? null) hidden.push(byId[q]);
      const names = hidden.slice(0, 8).map(h => "· " + titleOf(h)).join("\n");
      const more = hidden.length > 8 ? `\n… 외 ${hidden.length - 8}개` : "";
      c.addEventListener("mouseenter", () => showTooltip(c, `필터에 걸러진 ${nSkip}턴\n${names}${more}`));
      c.addEventListener("mouseleave", hideTooltip);
      map.appendChild(c);
    }

    if (marks.length) {
      const s = document.createElement("div");
      s.className = "seam"; s.textContent = marks.join(" ");
      s.style.left = ((x1+x2)/2) + "px"; s.style.top = ((y1+y2)/2 - 12) + "px";
      map.appendChild(s);
    }
  });

  VT.forEach((t, i) => {
    const side = tileSide(t);
    const n = document.createElement("div");
    n.className = "node" + (t.delegated ? " deleg" : "") + (t.hasError ? " err" : "");
    n.style.setProperty("--pc", `var(--${t.phase})`);
    n.style.left = X(t.id) + "px"; n.style.top = Y(t.id) + "px";
    n.style.width = side + "px"; n.style.height = side + "px";
    n.style.animationDelay = Math.min(i * 10, 450) + "ms";
    n.dataset.id = t.id;
    n.innerHTML = nodeBaseHtml(t);
    n.addEventListener("mouseenter", () => showTooltip(n, tipText(t)));
    n.addEventListener("mouseleave", hideTooltip);
    n.addEventListener("click", (ev) => {
      ev.stopPropagation();
      hideTooltip();
      if (ev.shiftKey) {
        if (expandedId) closeExpanded(); // 범위를 잡는 동안엔 열려 있던 카드도 치운다
        if (selA === null) anchorAt(t.id); else trySetRangeEnd(t.id);
        return;
      }
      selectNode(t.id);
    });
    map.appendChild(n);
    NODE_EL[t.id] = n;

    const lbl = document.createElement("div");
    lbl.className = "node-label" + (t.isForkRoot ? " fork" : "") + (isProv(t) ? " prov" : "");
    lbl.textContent = titleOf(t);
    lbl.style.left = X(t.id) + "px"; lbl.style.top = (Y(t.id) + side / 2 + 5) + "px";
    lbl.style.animationDelay = Math.min(i * 10, 450) + 60 + "ms";
    lbl.dataset.id = t.id;
    map.appendChild(lbl);
  });

  applySelectionClasses();
  // animated (not instant) — the camera zooming out to reveal the whole tree is the intended entrance effect
  requestAnimationFrame(() => {
    if (KEEP_CAMERA) { KEEP_CAMERA = false; applyTransform(camTx, camTy, camScale, true); }
    else if (expandedId && byId[expandedId]) focusOn(expandedId);
    else fitAll();
  });
}

// ── 자동 갱신: 세션 파일 변화를 폴링, 새 턴이 생기면 조용히 반영 ──
// silent 갱신은 ① 턴 내용이 그대로면 아무것도 안 하고 ② 바뀌었을 때만
// 애니메이션·카메라 이동 없이 제자리 갱신한다.
let lastMtime = 0, KEEP_CAMERA = false, NOANIM = false;
setInterval(async () => {
  if (!CURRENT_PROJECT || document.hidden) return;
  // 카드·모달·"두 턴 이상" 범위 선택·갈래 응답 대기 중엔 보류. 단일 클릭(selA만)은
  // 범위 시작점일 뿐이라 갱신을 막지 않는다 — 막으면 첫 클릭 후 자동 갱신이 영원히 죽는다.
  // PENDING_BR 중 보류: 폴링의 fetchBranches가 방금 도착한 갈래 답변을 잠깐 덮는 경합 방지.
  if (expandedId || selB !== null || PENDING_BR || modal.classList.contains("open")) return;
  try {
    const j = await fetch(`/api/mtime?project=${encodeURIComponent(CURRENT_PROJECT)}`).then(r => r.json());
    if (!j.mtime || j.mtime === lastMtime) { lastMtime = j.mtime || lastMtime; return; }
    const firstObservation = !lastMtime; // 기준값만 기록, 재로드는 실제 변화부터
    lastMtime = j.mtime;
    if (!firstObservation) await loadTurns(CURRENT_PROJECT, { silent: true });
  } catch { /* 서버 재시작 등 일시 오류 무시 */ }
}, 10_000);

// ═══ 세션 뷰: 한 세션만 한 줄로 + 캡슐(접힌 구간) + 포탈(다른 세션 워프) ═══
const SHORT_TS = ts => {
  if (!ts) return "?";
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

function sessionsOf() {
  const m = new Map();
  for (const t of TURNS) {
    const s = m.get(t.sessionId);
    if (!s) m.set(t.sessionId, { id: t.sessionId, first: t, last: t, count: 1 });
    else {
      s.count++;
      if ((t.timestamp ?? "") < (s.first.timestamp ?? "")) s.first = t;
      if ((t.endTimestamp ?? "") > (s.last.endTimestamp ?? "")) s.last = t;
    }
  }
  // 최근 활동순 정렬 — 새로 대화가 이어지면 그 세션이 목록 끝(=기본 선택)으로 온다
  const lastTs = s => s.last.endTimestamp ?? s.last.timestamp ?? "";
  return [...m.values()].sort((a, b) => lastTs(a).localeCompare(lastTs(b)));
}
// 표기 시간도 시작 시각이 아니라 "마지막으로 대화한 시각" — 이어서 대화하면 갱신됨
const sessLastTs = s => s.last.endTimestamp ?? s.last.timestamp;
const sessOptLabel = s => `${SHORT_TS(sessLastTs(s))} · ${titleOf(s.first).slice(0, 18)} (${s.count}턴)`;
function sessShort(sid) {
  const s = sessionsOf().find(x => x.id === sid);
  return s ? `${SHORT_TS(sessLastTs(s))} · ${titleOf(s.first)}` : sid.slice(0, 8);
}
function rebuildSessionSelect() {
  const sel = document.getElementById("session-select");
  const sessions = sessionsOf();
  // 루트 UUID.jsonl에서 온 세션 = 사람이 직접 대화한 세션. 나머지(subagents/의
  // 에이전트 기록 등)는 뒤 그룹으로 — 턴 수 어림짐작이 아니라 저장 구조 신호로 구분.
  const isHuman = s => HUMAN_SESS.size ? HUMAN_SESS.has(s.id) : s.count >= 3;
  const majors = sessions.filter(isHuman);
  const minors = sessions.filter(s => !isHuman(s));
  // 미정(undefined)이거나 사라진 세션이면 "최신 주요 세션"으로 — "전체"(null)는 사용자의 선택이니 유지
  if (SESSION_SCOPE === undefined || (SESSION_SCOPE && !sessions.some(s => s.id === SESSION_SCOPE)))
    SESSION_SCOPE = (majors.length ? majors[majors.length - 1] : sessions[sessions.length - 1])?.id ?? null;
  sel.innerHTML = "";
  const addGroup = (label, list, toOpt) => {
    if (!list.length) return;
    const g = document.createElement("optgroup");
    g.label = label;
    for (const item of list) g.appendChild(toOpt(item));
    sel.appendChild(g);
  };
  const sessOpt = s => {
    const opt = document.createElement("option");
    opt.value = s.id; opt.textContent = sessOptLabel(s);
    return opt;
  };
  addGroup("세션", majors, sessOpt);
  addGroup("⑂ 갈래", BRANCHES, b => {
    const opt = document.createElement("option");
    opt.value = "br:" + b.id;
    opt.textContent = `⑂ ${b.title.slice(0, 20)} (${Math.floor(b.messages.length / 2)}문답)`;
    return opt;
  });
  addGroup("에이전트·도구 기록", minors, sessOpt);
  const all = document.createElement("option");
  all.value = ""; all.textContent = "전체 트리";
  sel.appendChild(all);
  sel.value = BRANCH_SCOPE ? "br:" + BRANCH_SCOPE : (SESSION_SCOPE ?? "");
  if (sel.selectedIndex < 0) sel.value = SESSION_SCOPE ?? "";
}
document.getElementById("session-select").addEventListener("change", (e) => {
  const v = e.target.value;
  CRUMBS = []; EXPANDED_CAPS = new Set(); PENDING_BR = null;
  expandedId = null; clearSel();
  if (v.startsWith("br:")) {
    const br = BRANCHES.find(b => b.id === v.slice(3));
    if (!br) { rebuildSessionSelect(); render(); return; } // 사라진 갈래 — 목록만 재구성, "br:x"를 세션으로 오인하지 않게
    // 크럼에는 "떠나온 곳"을 담는다 — 전체 트리(null)에서 왔으면 그대로 전체 트리로 복귀
    const origin = SESSION_SCOPE !== undefined ? SESSION_SCOPE : (byId[br.turnId]?.sessionId ?? null);
    CRUMBS = [{ session: origin, turnId: br.turnId }];
    SESSION_SCOPE = byId[br.turnId]?.sessionId ?? origin;
    BRANCH_SCOPE = br.id;
    render();
    return;
  }
  SESSION_SCOPE = v || null;
  BRANCH_SCOPE = null;
  render();
});

function renderCrumbs() {
  const el = document.getElementById("crumbs");
  el.innerHTML = "";
  if (!CRUMBS.length) return;
  CRUMBS.forEach((c, i) => {
    const chip = document.createElement("button");
    chip.className = "crumb";
    chip.textContent = `⟨ ${c.session ? sessShort(c.session).slice(0, 26) : "전체 트리"}`;
    chip.addEventListener("click", () => {
      CRUMBS = CRUMBS.slice(0, i);
      SESSION_SCOPE = c.session;
      BRANCH_SCOPE = null; PENDING_BR = null;
      EXPANDED_CAPS = new Set(); expandedId = null; clearSel();
      rebuildSessionSelect();
      render();
      requestAnimationFrame(() => requestAnimationFrame(() => focusOn(c.turnId)));
    });
    el.appendChild(chip);
  });
}

function goPortal(anchorId, target) {
  CRUMBS.push({ session: SESSION_SCOPE, turnId: anchorId });
  if (CRUMBS.length > 8) CRUMBS.shift(); // 포탈을 오가도 무한히 안 쌓이게
  SESSION_SCOPE = target.sessionId;
  BRANCH_SCOPE = null; PENDING_BR = null;
  EXPANDED_CAPS = new Set(); expandedId = null; clearSel();
  rebuildSessionSelect();
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => focusOn(target.id)));
}

// ── 캡슐 그룹핑: 결정 신호(공백·⑊)에서만 자르고, 중요 턴(에러·포크·갈래)과
//    최근 5턴은 절대 삼키지 않는다. 접기는 무손실 — 펼치면 전부 나온다.
// 실측: 세션 대부분이 20~44턴이라 문턱 40은 캡슐이 거의 안 생김 → 20으로
const CAP_MIN_SESSION = 20, CAP_MIN_RUN = 4, CAP_TAIL_KEEP = 5;
// 세션 뷰에서 이웃한 요소(노드·캡슐·접기 칩)의 가장자리 사이 간격 — 종류와 무관하게 동일.
// 시간표(⋯/⑊)가 이 사이에 들어가므로 그 폭(≈72px)보다 넉넉해야 한다.
const SESS_GAP = 84;
const CHIP_W = 68; // "⟨ 접기" 칩의 실제 렌더 폭(11.5px 글자 + 좌우 패딩 14px)
const skipLabel = el => (el.open ? "− 접기" : "+" + el.turns.length);
// .skip은 10.5px — estTextW(11.5px 기준)에 비율을 곱하고 좌우 패딩 22 + 테두리를 더한다
const skipChipW = el => Math.round(estTextW(skipLabel(el)) * 0.91 + 24);

// 필터 모드: 켜진 국면의 턴만 노드로 남기고, 사이에 낀 턴들은 "+N" 한 칸으로 접는다.
// 캡슐 그룹핑과 겹쳐 쓰지 않는 이유 — 접힌 게 시간 공백 때문인지 필터 때문인지
// 화면에서 구분할 수 없게 된다.
function buildFilteredElements(sess) {
  const els = [];
  let run = [];
  const flush = () => {
    if (!run.length) return;
    const skipId = "skip:" + run[0].id;
    const open = EXPANDED_SKIPS.has(skipId);
    for (const t of run) SKIP_OF[t.id] = skipId;
    els.push({ type: "skip", skipId, turns: run, open });
    if (open) for (const t of run) els.push({ type: "turn", t, muted: true });
    run = [];
  };
  for (const t of sess) {
    if (PHASE_FILTER.has(t.phase)) { flush(); els.push({ type: "turn", t }); }
    else run.push(t);
  }
  flush();
  return els;
}

// 주제 렌즈 배치: 세션 전체를 주제 구간 캡슐로 재편성 — 캡슐 제목 = 주제명.
// 기존 캡슐 문법(클릭=펼침, shift=범위, 점띠)을 그대로 물려받으므로 별도 학습 비용이 없다.
let TOPIC_ROWS = []; // 병합된 행 메타 [{name, turnN, fragN}] — 행 머리글용
function buildTopicElements(sess) {
  const pos = new Map(sess.map((t, i) => [t.id, i]));
  // 재방문 병합: 같은 group(서버가 이름·식별자 유사도로 판정)의 조각들이 한 행에 시간순으로.
  // 행 사이는 주제, 행 안은 시간 — 조각 경계는 ⟲ 갭 표시로 시간 점프를 정직하게 드러낸다.
  const rowsMap = new Map();
  TOPIC_SEGS.forEach((seg, si) => {
    const g = seg.group ?? si;
    if (!rowsMap.has(g)) rowsMap.set(g, []);
    rowsMap.get(g).push({ seg, si });
  });
  const els = [];
  TOPIC_ROWS = [];
  [...rowsMap.values()].forEach((frags, row) => {
    let turnN = 0;
    frags.forEach(({ seg, si }, fi) => {
      const turns = seg.ids.map(id => sess[pos.get(id)]).filter(Boolean);
      if (!turns.length) return;
      turnN += turns.length;
      const tag = { row, topicIdx: si, frag: fi };
      if (turns.length === 1) { els.push({ type: "turn", t: turns[0], ...tag }); return; }
      const capId = "topic:" + turns[0].id;
      for (const t of turns) CAP_OF[t.id] = capId;
      if (EXPANDED_CAPS.has(capId)) {
        els.push({ type: "collapse", capId, t0: turns[0], ...tag });
        for (const t of turns) els.push({ type: "turn", t, expandedCap: capId, ...tag });
      } else els.push({ type: "cap", capId, turns, topicName: seg.name, ...tag });
    });
    TOPIC_ROWS.push({ name: frags[0].seg.name, turnN, fragN: frags.length });
  });
  return els;
}

function buildSessionElements(sess, portals) {
  const isSolo = t => t.hasError || t.isForkRoot || portals.has(t.id) || branchesFor(t.id).length > 0;
  const els = [];
  CAP_OF = {}; SKIP_OF = {};
  if (TOPIC_ON && TOPIC_SEGS && sess.length && sess[0].sessionId === TOPIC_SESSION) {
    const te = buildTopicElements(sess);
    if (te.length) return te; // 주제 배치가 국면 필터·일반 캡슐보다 우선
  }
  if (PHASE_FILTER.size) return buildFilteredElements(sess);
  if (sess.length < CAP_MIN_SESSION) {
    for (const t of sess) els.push({ type: "turn", t });
    return els;
  }
  let run = [];
  const flush = () => {
    if (run.length >= CAP_MIN_RUN) {
      const capId = run[0].id;
      for (const t of run) CAP_OF[t.id] = capId;
      if (EXPANDED_CAPS.has(capId)) {
        els.push({ type: "collapse", capId, t0: run[0] });
        for (const t of run) els.push({ type: "turn", t, expandedCap: capId });
      } else els.push({ type: "cap", capId, turns: run });
    } else for (const t of run) els.push({ type: "turn", t });
    run = [];
  };
  sess.forEach((t, i) => {
    if (t.compactBefore || (t.gapMin || 0) >= 30) flush();
    if (isSolo(t) || i >= sess.length - CAP_TAIL_KEEP) { flush(); els.push({ type: "turn", t }); }
    else run.push(t);
  });
  flush();
  return els;
}

// 알약 폭을 잡기 위한 텍스트 폭 추정(11.5px 기준). 실측(measureText) 대신 추정을
// 쓰는 이유: 가로 배치는 DOM을 만들기 전에 각 요소의 x좌표를 확정해야 한다.
// CJK는 거의 전각, ASCII는 반각으로 어림한다.
function estTextW(s) {
  let w = 0;
  for (const ch of s) w += ch.codePointAt(0) < 0x2e80 ? 6.4 : 11.5;
  return w;
}
// 알약이 실제로 담아야 하는 폭 — 제목과 점띠 중 넓은 쪽 + 좌우 패딩
function capPillW(turns, name) {
  const titleW = estTextW((name ?? titleOf(turns[0])) + ` · ${turns.length}턴`);
  const dotsW = Math.min(turns.length, 40) * 6; // 점 4px + gap 2px
  return Math.round(clamp(Math.max(titleW, dotsW) + 34, 110, 300));
}

function capPhase(turns) {
  const cnt = { edit: 0, exec: 0, explore: 0, chat: 0 };
  for (const t of turns) cnt[t.phase]++;
  const max = Math.max(cnt.edit, cnt.exec, cnt.explore, cnt.chat);
  return ["edit", "exec", "explore", "chat"].find(p => cnt[p] === max);
}
function capTip(el) {
  const first = el.turns[0], last = el.turns[el.turns.length - 1];
  const dur = first.timestamp && last.endTimestamp
    ? Math.max(0, Math.round((Date.parse(last.endTimestamp) - Date.parse(first.timestamp)) / 60000)) : 0;
  return `${titleOf(first)} → ${titleOf(last)}\n${el.turns.length}턴 · ${fmtGap(dur)} · 클릭=펼치기 · shift+클릭=범위선택`;
}

function renderSession() {
  const map = document.getElementById("map");
  const svg = document.getElementById("links");
  map.classList.toggle("noanim", NOANIM);
  map.querySelectorAll(".node,.seam,.node-label,.capsule,.cap-collapse,.skip,.portal,.cap-region,.topic-band,.topic-rowhdr").forEach(e => e.remove());
  map.classList.remove("searching"); // 노드가 새로 그려지므로 검색 흐림도 함께 해제
  svg.innerHTML = "";
  NODE_EL = {}; LAST_XY = {};

  const kids = {};
  TURNS.forEach(t => { (kids[parentOf[t.id]] ??= []).push(t); });
  KIDS = kids;

  const sess = TURNS.filter(t => t.sessionId === SESSION_SCOPE)
    .sort((a, b) => (a.timestamp ?? "").localeCompare(b.timestamp ?? ""));
  VIEW_SESS = sess;
  document.getElementById("empty").style.display = sess.length ? "none" : "flex";
  buildChapterBar(sess);
  if (!sess.length) return;

  // 포탈 대상: 이 세션의 턴에서 다른 세션으로 갈라진 자식들
  const portals = new Map();
  for (const t of sess) {
    const out = (kids[t.id] ?? []).filter(c => c.sessionId !== SESSION_SCOPE);
    if (out.length) portals.set(t.id, out);
  }
  const rootParent = parentOf[sess[0].id] ? byId[parentOf[sess[0].id]] : null;

  const els = buildSessionElements(sess, portals);

  // 가로 배치 — 요소의 "가장자리 사이 간격"을 일정하게 둔다.
  // 예전엔 요소마다 고정 폭 칸(턴 108, 캡슐 pillW+40)을 배정했는데, 실제로 그려지는
  // 크기는 제각각(노드 16~30px, 캡슐 110~300px)이라 눈에 보이는 간격이 29~92px로
  // 들쭉날쭉했다. 이제 각자의 실제 폭을 재고 사이 간격만 GAP으로 고정한다.
  // 주제 배치: 주제마다 자기 행(row) — 위→아래로 주제, 행 안에서는 시간순 유지
  const TOPIC_MODE = els.length > 0 && els[0].row !== undefined;
  // 행 높이 150 → 116: 8행이면 1,200px라 전체 보기 배율이 과하게 줄어 노드가 안 읽혔다
  const ROWH = 116, ROW_HEAD_W = 150;
  const Y0 = PADY + 30;
  // 역방향 포탈 자리는 실제 배치 규칙(간격 한 칸 + 포탈 22px)과 맞춰 비운다.
  // 주제 모드에서도 같은 자리를 비워야 한다 — 안 그러면 포탈이 왼쪽 머리글 위에 겹친다.
  const backW = rootParent ? SESS_GAP + 30 : 0;
  let x = (TOPIC_MODE ? PADX + ROW_HEAD_W : PADX) + backW;
  let maxX = x, curRow = TOPIC_MODE ? els[0].row : 0;
  for (const el of els) {
    // 턴 수만으로 캡슐 폭을 잡으면 긴 제목이 알약 밖으로 삐져나온다 — 제목 길이 반영
    if (el.type === "turn") el.halfW = tileSide(el.t) / 2;
    else if (el.type === "cap") { el.pillW = capPillW(el.turns, el.topicName); el.halfW = el.pillW / 2; }
    else if (el.type === "skip") el.halfW = skipChipW(el) / 2;
    else el.halfW = CHIP_W / 2;
    // 모든 행이 같은 x에서 시작해야 밴드가 세로로 정렬된다 — 포탈 자리도 동일하게 반영
    if (TOPIC_MODE && el.row !== curRow) { maxX = Math.max(maxX, x); curRow = el.row; x = PADX + ROW_HEAD_W + backW; }
    el.cy = TOPIC_MODE ? Y0 + el.row * ROWH : Y0;
    el.cx = x + el.halfW;
    x += el.halfW * 2 + SESS_GAP;
  }
  maxX = Math.max(maxX, x);
  const hasPortal = portals.size > 0 || rootParent;
  const rowN = TOPIC_MODE ? Math.max(...els.map(e => e.row)) + 1 : 1;
  CONTENT_W = (els.length ? maxX - SESS_GAP : maxX) + PADX;
  CONTENT_H = Y0 + (rowN - 1) * ROWH + (hasPortal ? Math.round(LANEH * 0.85) + 60 : 70) + PADY;
  map.style.width = CONTENT_W + "px";
  map.style.height = CONTENT_H + "px";
  svg.setAttribute("width", CONTENT_W); svg.setAttribute("height", CONTENT_H);
  svg.setAttribute("viewBox", `0 0 ${CONTENT_W} ${CONTENT_H}`);

  const elId = el => (el.type === "turn" ? el.t.id : el.capId ?? el.skipId);
  const elEndTs = el => el.type === "turn" ? (el.t.endTimestamp ?? el.t.timestamp)
    : el.turns ? (el.turns[el.turns.length - 1].endTimestamp ?? el.turns[el.turns.length - 1].timestamp)
    : (el.t0?.timestamp ?? null);
  const elStartTs = el => el.type === "turn" ? el.t.timestamp : (el.turns?.[0].timestamp ?? el.t0?.timestamp ?? null);
  for (let i = 1; i < els.length; i++) {
    if (els[i].row !== els[i - 1].row) continue; // 주제 행 경계 — 이음선 없음
    // 재방문 조각 경계: 같은 주제의 떨어진 시간대가 이어지는 자리 — 점선 + ⟲ 갭 표시
    const fragJump = els[i].frag !== undefined && els[i].frag !== els[i - 1].frag;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M ${els[i - 1].cx} ${els[i].cy} L ${els[i].cx} ${els[i].cy}`);
    // 생략 구간에 닿는 이음선은 점선 — 여기는 실제로 건너뛴 자리라는 표시
    const skipSide = els[i - 1].type === "skip" || els[i].type === "skip" || fragJump;
    p.setAttribute("class", "link" + (skipSide ? " skipline" : ""));
    p.dataset.from = elId(els[i - 1]); p.dataset.to = elId(els[i]);
    svg.appendChild(p);
    const t0 = els[i].type === "turn" ? els[i].t : (els[i].turns?.[0] ?? els[i].t0);
    const marks = [];
    if (fragJump) { // 재방문 경계: 실제 벌어진 시간을 계산해 표시
      const a = elEndTs(els[i - 1]), b = elStartTs(els[i]);
      const g = a && b ? Math.max(0, Math.round((Date.parse(b) - Date.parse(a)) / 60000)) : 0;
      marks.push("⟲" + (g >= 1 ? " " + fmtGap(g) : ""));
    }
    if (t0?.compactBefore) marks.push("⑊");
    if (!fragJump && (t0?.gapMin || 0) >= 30) marks.push("⋯" + fmtGap(t0.gapMin));
    if (marks.length) {
      const s = document.createElement("div");
      s.className = "seam"; s.textContent = marks.join(" ");
      // 두 요소의 "가장자리 사이" 한가운데 — 중심끼리의 중점을 쓰면 폭이 넓은 캡슐
      // 안쪽에 찍혀 제목 위에 겹쳤다
      const gapL = els[i - 1].cx + els[i - 1].halfW;
      const gapR = els[i].cx - els[i].halfW;
      s.style.left = ((gapL + gapR) / 2) + "px";
      s.style.top = (els[i].cy - 12) + "px";
      map.appendChild(s);
    }
  }

  // 펼쳐진 캡슐 범위를 감싸는 영역 표시 — 어디부터 어디까지가 그 캡슐이었는지
  const regions = new Map();
  for (const el of els) {
    const rid = el.type === "collapse" ? el.capId : el.expandedCap;
    if (!rid) continue;
    const r = regions.get(rid) ?? { min: el.cx, max: el.cx, cy: el.cy };
    r.min = Math.min(r.min, el.cx); r.max = Math.max(r.max, el.cx);
    regions.set(rid, r);
  }
  const mapEl = document.getElementById("map");
  for (const r of regions.values()) {
    const d = document.createElement("div");
    d.className = "cap-region";
    d.style.left = (r.min - 48) + "px";
    d.style.width = (r.max - r.min + 96) + "px";
    d.style.top = (r.cy - 36) + "px";
    d.style.height = "96px";
    mapEl.appendChild(d);
  }

  let ni = 0;
  for (const el of els) {
    if (el.type === "turn") makeSessionTurnNode(el.t, el.cx, el.cy, ni++, el.muted);
    else if (el.type === "cap") makeCapsule(el, el.cy, ni++);
    else if (el.type === "skip") makeSkipChip(el, el.cy, ni++);
    else makeCollapseChip(el, el.cy, ni++);
  }

  // 주제 행 배치: 행마다 색 밴드 + 왼쪽 머리글 (주제명 · 재방문 횟수)
  if (TOPIC_MODE) {
    TOPIC_ROWS.forEach((rowMeta, ri) => {
      const rowEls = els.filter(e => e.row === ri);
      if (!rowEls.length) return;
      const cy = rowEls[0].cy;
      const hue = TOPIC_HUES[ri % TOPIC_HUES.length];
      const band = document.createElement("div");
      band.className = "topic-band";
      band.style.top = (cy - Math.round(ROWH / 2) + 8) + "px";
      band.style.height = (ROWH - 24) + "px";
      // 밴드는 그 행이 실제로 차지하는 구간만 덮는다 — 전체 폭을 덮으면 2턴짜리
      // 주제도 화면 끝까지 색이 깔려 행 길이가 안 읽히고 색만 번잡해진다
      const right = Math.max(...rowEls.map(e => e.cx + e.halfW)) + 20;
      const bandL = PADX + ROW_HEAD_W + backW - 26;
      band.style.left = bandL + "px";
      band.style.width = Math.max(0, right - bandL) + "px";
      band.style.background = TOPIC_TINT(hue, ri % 2 ? 0.075 : 0.045);
      map.appendChild(band);
      const hd = document.createElement("div");
      hd.className = "topic-rowhdr";
      hd.innerHTML = `<i style="background:${TOPIC_MARK(hue)}"></i>${esc(rowMeta.name)}${rowMeta.fragN > 1 ? ` <span class="th-n">⟲${rowMeta.fragN}</span>` : ""}`;
      hd.style.left = (PADX - 4) + "px";
      hd.style.top = cy + "px";
      hd.title = `${rowMeta.name} · ${rowMeta.turnN}턴${rowMeta.fragN > 1 ? ` · 재방문 ${rowMeta.fragN}회 병합` : ""} — 클릭하면 이동`;
      const firstEl = rowEls[0];
      hd.onclick = () => focusOn(firstEl.type === "turn" ? firstEl.t.id : firstEl.capId);
      map.appendChild(hd);
    });
  }

  // 포탈 노드 (기존 차선 변경 곡선 문법 재사용)
  for (const [anchorId, targets] of portals) {
    const a = LAST_XY[anchorId]; if (!a) continue;
    targets.forEach((tg, j) => {
      const ay = a.y ?? Y0; // 주제 행 배치에서는 앵커가 자기 행 높이에 있다
      const px = a.x + 46 + j * 64, py = ay + Math.round(LANEH * 0.85);
      const mx = a.x + (px - a.x) * 0.5;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", `M ${a.x} ${ay} L ${mx - 14} ${ay} Q ${mx} ${ay} ${mx} ${ay + 14} L ${mx} ${py - 14} Q ${mx} ${py} ${mx + 14} ${py} L ${px} ${py}`);
      p.setAttribute("class", "link");
      svg.appendChild(p);
      const d = document.createElement("div");
      d.className = "portal";
      d.style.left = px + "px"; d.style.top = py + "px";
      d.addEventListener("mouseenter", () => showTooltip(d, `↷ 포크 세션으로 이동\n${tipText(tg)}`));
      d.addEventListener("mouseleave", hideTooltip);
      d.addEventListener("click", (ev) => { ev.stopPropagation(); hideTooltip(); goPortal(anchorId, tg); });
      map.appendChild(d);
      const lbl = document.createElement("div");
      lbl.className = "node-label fork";
      lbl.textContent = tg.forkName ?? SHORT_TS(tg.timestamp);
      lbl.style.left = px + "px"; lbl.style.top = (py + 14) + "px";
      map.appendChild(lbl);
    });
  }

  // 역방향 포탈: 이 세션이 다른 세션에서 갈라져 나온 경우
  if (rootParent && els.length) {
    // 중심에서 74px 왼쪽에 두면 첫 요소가 넓은 캡슐(최대 300px)일 때 알약 안쪽에 박힌다
    // — 시간표 겹침과 같은 종류의 실수. 가장자리 기준으로 한 칸 띄운다.
    const px = els[0].cx - els[0].halfW - SESS_GAP, py = els[0].cy ?? Y0;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M ${px} ${py} L ${els[0].cx} ${py}`);
    p.setAttribute("class", "link");
    svg.appendChild(p);
    const d = document.createElement("div");
    d.className = "portal back";
    d.style.left = px + "px"; d.style.top = py + "px";
    d.addEventListener("mouseenter", () => showTooltip(d, `↩ 원 세션으로 돌아가기\n${tipText(rootParent)}`));
    d.addEventListener("mouseleave", hideTooltip);
    d.addEventListener("click", (ev) => { ev.stopPropagation(); hideTooltip(); goPortal(sess[0].id, rootParent); });
    map.appendChild(d);
    const lbl = document.createElement("div");
    lbl.className = "node-label fork";
    lbl.textContent = "원 세션";
    lbl.style.left = px + "px"; lbl.style.top = (py + 14) + "px";
    map.appendChild(lbl);
  }

  applySelectionClasses();
  requestAnimationFrame(() => {
    if (KEEP_CAMERA) { KEEP_CAMERA = false; applyTransform(camTx, camTy, camScale, true); }
    else if (expandedId && byId[expandedId]) focusOn(expandedId);
    else fitAll();
  });
}

function makeSessionTurnNode(t, x, y, i, muted) {
  const map = document.getElementById("map");
  const side = tileSide(t);
  const n = document.createElement("div");
  // muted = 필터에 안 걸렸지만 생략 구간을 펼쳐서 드러난 턴 — 흐리게 구분
  n.className = "node" + (t.delegated ? " deleg" : "") + (t.hasError ? " err" : "") + (muted ? " muted" : "");
  n.style.setProperty("--pc", `var(--${t.phase})`);
  n.style.left = x + "px"; n.style.top = y + "px";
  n.style.width = side + "px"; n.style.height = side + "px";
  n.style.animationDelay = Math.min(i * 10, 450) + "ms";
  n.dataset.id = t.id;
  n.innerHTML = nodeBaseHtml(t);
  n.addEventListener("mouseenter", () => showTooltip(n, tipText(t)));
  n.addEventListener("mouseleave", hideTooltip);
  n.addEventListener("click", (ev) => {
    ev.stopPropagation(); hideTooltip();
    // ⑂ 배지를 직접 누르면 갈래가 하나일 때 바로 워프 (여러 개면 카드에서 선택)
    const bs = branchesFor(t.id);
    if (bs.length === 1 && ev.target.closest(".brb")) { enterBranchView(bs[0].id); return; }
    if (ev.shiftKey) {
      if (expandedId) closeExpanded(); // 범위를 잡는 동안엔 열려 있던 카드도 치운다
      if (selA === null) anchorAt(t.id); else trySetRangeEnd(t.id);
      return;
    }
    selectNode(t.id);
  });
  map.appendChild(n);
  NODE_EL[t.id] = n;
  LAST_XY[t.id] = { x, y };
  const lbl = document.createElement("div");
  lbl.className = "node-label" + (t.isForkRoot ? " fork" : "") + (isProv(t) ? " prov" : "") + (muted ? " muted" : "");
  lbl.textContent = titleOf(t);
  // 세션 뷰는 노드 간격이 좁아 제목이 서로 잘림 — 홀짝으로 두 줄에 엇갈려 배치해
  // 폭을 넓게 쓴다(들어가자마자 제목이 온전히 읽히도록)
  lbl.style.left = x + "px"; lbl.style.top = (y + side / 2 + 5 + (i % 2 ? 16 : 0)) + "px";
  lbl.style.maxWidth = "150px";
  lbl.style.animationDelay = Math.min(i * 10, 450) + 60 + "ms";
  lbl.dataset.id = t.id;
  map.appendChild(lbl);
}

function makeCapsule(el, y, i) {
  const map = document.getElementById("map");
  const first = el.turns[0], last = el.turns[el.turns.length - 1];
  const c = document.createElement("div");
  c.className = "capsule";
  c.style.setProperty("--pc", `var(--${capPhase(el.turns)})`);
  c.style.left = el.cx + "px"; c.style.top = y + "px";
  c.style.width = el.pillW + "px";
  c.style.animationDelay = Math.min(i * 10, 450) + "ms";
  c.dataset.first = first.id; c.dataset.last = last.id;
  const dots = el.turns.slice(0, 40).map(t => `<i style="background:var(--${t.phase})"></i>`).join("");
  // 캡슐 제목: ① 주제 배치면 주제명(확정) ② 구간 대표 LLM 제목 ③ 첫 턴 제목(임시) 순
  const isTopic = !!el.topicName;
  const capKey = isTopic ? "" : el.turns[0].hash + "-" + el.turns[el.turns.length - 1].hash + "-" + el.turns.length;
  if (!isTopic) CAP_HASHES[capKey] = el.turns.map(t => t.hash); // 주제 캡슐은 라벨 생성 요청 대상이 아님
  const capTitle = el.topicName ?? CAP_LABELS[capKey];
  c.innerHTML = `<div class="cap-title"><span class="cap-t${!capTitle && isProv(first) ? " prov" : ""}"${isTopic ? ' data-topic="1"' : ""} data-id="${esc(first.id)}" data-cap="${esc(capKey)}">${esc(capTitle ?? titleOf(first))}</span> <span class="cap-n">· ${el.turns.length}턴</span></div><div class="cap-dots">${dots}</div>`;
  if (isTopic) c.classList.add("topic");
  c.addEventListener("mouseenter", () => showTooltip(c, capTip(el)));
  c.addEventListener("mouseleave", hideTooltip);
  c.addEventListener("click", (ev) => {
    ev.stopPropagation(); hideTooltip();
    if (ev.shiftKey) { // 캡슐 통째 범위 선택
      if (expandedId) closeExpanded(); // 범위를 잡는 동안엔 열려 있던 카드도 치운다
      if (selA === null) { selA = first.id; selB = last.id; selShift = true; }
      else trySetRangeEnd(last.id);
      updateSel(); applySelectionClasses();
      return;
    }
    KEEP_CAMERA = true;
    EXPANDED_CAPS.add(el.capId);
    renderSession();
    requestAnimationFrame(() => requestAnimationFrame(() => focusOn(first.id)));
  });
  map.appendChild(c);
  LAST_XY[el.capId] = { x: el.cx, y };
}

function makeSkipChip(el, y, i) {
  const map = document.getElementById("map");
  const c = document.createElement("div");
  c.className = "skip" + (el.open ? " open" : "");
  c.style.left = el.cx + "px"; c.style.top = y + "px";
  c.style.animationDelay = Math.min(i * 10, 450) + "ms";
  c.textContent = skipLabel(el);
  const names = el.turns.slice(0, 8).map(t => "· " + titleOf(t)).join("\n");
  const more = el.turns.length > 8 ? `\n… 외 ${el.turns.length - 8}개` : "";
  c.addEventListener("mouseenter", () => showTooltip(c,
    `필터에 걸러진 ${el.turns.length}턴 — 클릭하면 ${el.open ? "다시 접기" : "펼쳐 보기"}\n${names}${more}`));
  c.addEventListener("mouseleave", hideTooltip);
  c.addEventListener("click", (ev) => {
    ev.stopPropagation(); hideTooltip();
    KEEP_CAMERA = true;
    if (el.open) EXPANDED_SKIPS.delete(el.skipId); else EXPANDED_SKIPS.add(el.skipId);
    renderSession();
  });
  map.appendChild(c);
  LAST_XY[el.skipId] = { x: el.cx, y };
}

function makeCollapseChip(el, y, i) {
  const map = document.getElementById("map");
  const c = document.createElement("div");
  c.className = "cap-collapse";
  c.style.left = el.cx + "px"; c.style.top = y + "px";
  c.style.animationDelay = Math.min(i * 10, 450) + "ms";
  c.textContent = "⟨ 접기";
  c.addEventListener("click", (ev) => {
    ev.stopPropagation(); hideTooltip();
    KEEP_CAMERA = true;
    EXPANDED_CAPS.delete(el.capId);
    renderSession();
    requestAnimationFrame(() => requestAnimationFrame(() => focusOn(el.capId)));
  });
  map.appendChild(c);
}

// ── 챕터 바: 세션 전체를 국면색 눈금으로 — 클릭=이동, 드래그=압축 범위 선택 ──
function buildChapterBar(sess) {
  const bar = document.getElementById("chapcells");
  bar.innerHTML = "";
  sess.forEach((t, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const special = t.isForkRoot || branchesFor(t.id).length > 0
      || (KIDS[t.id] ?? []).some(c => c.sessionId !== t.sessionId);
    cell.style.background = t.hasError ? "var(--err)" : special ? "#9b7fd4" : `var(--${t.phase})`;
    // 필터에 안 걸린 턴은 눈금에서도 흐리게 — 어디가 걸러졌는지 바에서도 읽히게
    if (PHASE_FILTER.size && !PHASE_FILTER.has(t.phase)) cell.classList.add("offphase");
    if (t.compactBefore || (t.gapMin || 0) >= 30) cell.classList.add("gapL");
    cell.dataset.i = i;
    bar.appendChild(cell);
  });
  paintTopicStrip(sess); // 주제 렌즈가 켜져 있고 같은 세션이면 스트립 재도색
}

// ── 주제 렌즈: 세션을 주제 구간으로 나눠 챕터 바 위에 색 스트립으로 표시 ──
// 경계는 LLM 추측층이므로 기본 꺼짐(토글) — 끄면 흔적 없이 사라진다.
let TOPIC_SEGS = null, TOPIC_SESSION = null, TOPIC_ON = false;
// 구간을 받아온 시점의 턴 목록 지문 — 껐다 켤 때 이게 그대로면 서버를 다시 부르지 않는다.
// (턴이 늘었으면 지문이 달라지므로 그때만 재분석한다)
let TOPIC_SIG = "";
const sessSig = () => TURNS.filter(t => t.sessionId === SESSION_SCOPE)
  .sort((a, b) => (a.timestamp ?? "").localeCompare(b.timestamp ?? "")).map(t => t.id).join(",");
// 톤온톤 원칙 — 색상환을 한 바퀴 도는 무지개(210·30·150·275·90·340·55·190)는 이 UI의
// 절제된 팔레트(--edit 203° · --exec 165° · --explore 97°)와 충돌해 번잡해 보였다.
// 청록~파랑의 좁은 유사색 대역만 쓰고, 구분은 채도가 아니라 명도 차로 준다.
const TOPIC_HUES = [203, 172, 152, 188];
const TOPIC_TINT = (h, a) => `hsl(${h} 30% 46% / ${a})`;   // 행 밴드 — 거의 무채색에 가깝게
const TOPIC_MARK = h => `hsl(${h} 38% 44%)`;               // 머리글 점 — 식별용으로만 조금 진하게
function paintTopicStrip(sess) {
  const strip = document.getElementById("topicstrip");
  if (!TOPIC_ON || !TOPIC_SEGS || !sess.length || sess[0].sessionId !== TOPIC_SESSION) {
    strip.innerHTML = ""; return;
  }
  const pos = new Map(sess.map((t, i) => [t.id, i]));
  strip.innerHTML = "";
  TOPIC_SEGS.forEach((seg, si) => {
    const idxs = seg.ids.map(id => pos.get(id)).filter(x => x !== undefined);
    if (!idxs.length) return;
    const count = idxs.length;
    const d = document.createElement("div");
    d.className = "tseg";
    d.style.flex = `${count} 1 0`;
    // 색은 병합 그룹 기준 — 스트립(시간순 미니맵)에서 같은 주제의 재방문 조각이 같은 색으로 보인다
    // 채도는 행 밴드와 같은 계열로 — 스트립만 60%로 튀면 상단이 다시 알록달록해진다
    d.style.background = `hsl(${TOPIC_HUES[(seg.group ?? si) % TOPIC_HUES.length]} 34% 46% / .32)`;
    d.textContent = seg.name;

// ── 검색: /api/search 결과를 드롭다운으로, 클릭하면 해당 턴으로 워프 ──
const searchBox = document.getElementById("search-box");
const searchRes = document.getElementById("search-results");
function clearSearch() {
  searchRes.innerHTML = "";
  document.getElementById("map").classList.remove("searching");
  document.querySelectorAll(".node.hit").forEach(n => n.classList.remove("hit"));
}
async function runSearch(q) {
  clearSearch();
  try {
    const j = await fetch(`/api/search?project=${encodeURIComponent(CURRENT_PROJECT)}&q=${encodeURIComponent(q)}&n=8`).then(r => r.json());
    const hits = j.hits || [];
    if (!hits.length) { searchRes.innerHTML = `<div class="sr-none">결과 없음 — 다른 단어(파일명·함수명)로 시도해보세요</div>`; return; }
    // 현재 화면에 있는 히트는 하이라이트
    const map = document.getElementById("map");
    let anyVisible = false;
    for (const h of hits) if (NODE_EL[h.id]) { NODE_EL[h.id].classList.add("hit"); anyVisible = true; }
    if (anyVisible) map.classList.add("searching");
    searchRes.innerHTML = hits.map((h, i) =>
      `<div class="sr" data-i="${i}">
        <div class="sr-t">${esc(h.title || "(제목 생성 전)")}${h.via === "graph" ? ' <span style="opacity:.6">· 연결로 발견</span>' : ""}</div>
        <div class="sr-g">${esc((h.gist || "").slice(0, 80))}</div>
        <div class="sr-m">${h.ts ? new Date(h.ts).toLocaleString("ko-KR") : ""} · 점수 ${h.score}</div>
      </div>`).join("");
    searchRes.querySelectorAll(".sr").forEach(el => el.onclick = () => {
      const h = hits[+el.dataset.i]; if (!h) return;
      clearSearch(); // 같은 세션 내 이동은 재렌더가 없을 수 있어 흐림까지 여기서 해제
      const iHere = VIEW_SESS.findIndex(t => t.id === h.id);
      if (iHere >= 0) { jumpToTurn(iHere); return; }
      // 다른 세션의 턴 — 세션 셀렉터를 통해 전환 후 착지 (포탈과 같은 문법)
      const sel = document.getElementById("session-select");
      if ([...sel.options].some(o => o.value === h.sessionId)) {
        sel.value = h.sessionId;
        sel.dispatchEvent(new Event("change"));
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const i2 = VIEW_SESS.findIndex(t => t.id === h.id);
          if (i2 >= 0) jumpToTurn(i2);
        }));
      } else if (byId[h.id]) { // 셀렉터에 없는 기록이면 전체 트리에서 착지
        sel.value = ""; sel.dispatchEvent(new Event("change"));
        requestAnimationFrame(() => requestAnimationFrame(() => focusOn(h.id)));
      }
    });
  } catch (e) { searchRes.innerHTML = `<div class="sr-none">검색 실패: ${esc(String(e.message || e))}</div>`; }
}
searchBox.addEventListener("keydown", (e) => {

searchBox.addEventListener("input", () => { if (!searchBox.value.trim()) clearSearch(); }); // 지우면 즉시 원상복구
document.addEventListener("click", (e) => {  // 바깥 클릭 = 검색 취소 (흐림·하이라이트까지 전부 원상복구)

function jumpToTurn(i) {
  const t = VIEW_SESS[i]; if (!t) return;
  if (revealHidden(t.id)) renderSession(); // 접힌 캡슐·필터로 가려진 턴이면 먼저 드러낸다

// 화면에 없는 턴을 감싸고 있는 접힘(캡슐/생략 구간)을 펼친다 — 펼친 게 있으면 true

  const sk = SKIP_OF[id];
  if (sk && !EXPANDED_SKIPS.has(sk)) { EXPANDED_SKIPS.add(sk); did = true; }
  if (did) KEEP_CAMERA = true;

}
const chapEl = document.getElementById("chapcells");
let chapDrag = null;

// ── camera: transform-based pan/zoom instead of native scrolling ──
const viewport = document.getElementById("viewport");
const stage = document.getElementById("stage");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let atHome = true;
let camScale = 1, camTx = 0, camTy = 0;
// a tree too large to fully fit stays readable instead of being crammed down
// to an unreadable scale — drag/wheel below cover the part that then falls
// outside the initial view.
const MIN_FIT_SCALE = 0.42, MIN_ZOOM = 0.12, MAX_ZOOM = 2.4;

function applyTransform(tx, ty, scale, instant) {
  camTx = tx; camTy = ty; camScale = scale;
  viewport.classList.toggle("instant", !!instant);
  viewport.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  if (instant) void viewport.offsetHeight;
  viewport.classList.remove("instant");
}
function fitAll(instant) {
  const r = stage.getBoundingClientRect();
  const rawFit = Math.min((r.width - 90) / CONTENT_W, (r.height - 90) / CONTENT_H);
  const scale = clamp(rawFit, MIN_FIT_SCALE, 1.3);
  const tx = (r.width - CONTENT_W * scale) / 2;
  const ty = (r.height - CONTENT_H * scale) / 2;
  applyTransform(tx, ty, scale, instant);
  atHome = true;
  document.getElementById("home-btn").classList.remove("show");
}
const EXPAND_SCALE = 0.85; // fixed, so a click always lands dead-center at a predictable, tested zoom
function focusOn(id, instant) {
  // 세션 뷰는 요소 폭이 가변이라 lane/depth 공식이 안 통함 — 두 렌더러 모두
  // 실제 좌표를 LAST_XY에 기록하고 카메라는 그것만 본다
  const p = LAST_XY[id]; if (!p) return;
  const r = stage.getBoundingClientRect();
  const x = p.x, y = p.y;
  applyTransform(r.width / 2 - x * EXPAND_SCALE, r.height / 2 - y * EXPAND_SCALE, EXPAND_SCALE, instant);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
}
document.getElementById("home-btn").addEventListener("click", homeView);
// background click / × just closes the card — it must NOT also reset the camera,
// only the dedicated "전체 보기" button does that
stage.addEventListener("click", () => {
  if (justDragged) return;
  if (expandedId) { closeExpanded(); return; }
  collapseAllCaps(); // 작은 "⟨ 접기" 칩을 정확히 누르지 않아도 배경 클릭으로 접힌다
});
function closeExpanded() {
  if (expandedId) collapseNode(expandedId);
}
// 펼쳐둔 캡슐을 한 번에 되접는다 — 접힌 게 있었으면 true
function collapseAllCaps() {
  if ((!EXPANDED_CAPS.size && !EXPANDED_SKIPS.size) || !SESSION_SCOPE || BRANCH_SCOPE) return false;
  EXPANDED_CAPS = new Set();

}
function homeView() {

}

// manual pan (drag) + wheel/trackpad zoom, so a tree that doesn't fully fit
// the "전체 보기" scale is still fully reachable
let panState = null, justDragged = false;
stage.addEventListener("pointerdown", (e) => {
  if (expandedId || e.target.closest(".node,.capsule,.portal,.cap-collapse")) return;
  panState = { x: e.clientX, y: e.clientY, tx: camTx, ty: camTy, moved: false };
  stage.classList.add("panning");
});
window.addEventListener("pointermove", (e) => {
  if (!panState) return;
  const dx = e.clientX - panState.x, dy = e.clientY - panState.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panState.moved = true;
  applyTransform(panState.tx + dx, panState.ty + dy, camScale, true);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
});
window.addEventListener("pointerup", () => {
  if (panState?.moved) { justDragged = true; setTimeout(() => { justDragged = false; }, 50); }
  panState = null;
  stage.classList.remove("panning");
});
stage.addEventListener("wheel", (e) => {
  if (expandedId) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const factor = Math.exp(-e.deltaY * 0.0012);
  const newScale = clamp(camScale * factor, MIN_ZOOM, MAX_ZOOM);
  const mapX = (cx - camTx) / camScale, mapY = (cy - camTy) / camScale;
  applyTransform(cx - mapX * newScale, cy - mapY * newScale, newScale, true);
  atHome = false;
  document.getElementById("home-btn").classList.add("show");
}, { passive: false });

// ── selection / expansion ──
function selectNode(id) {

  // it to counter-scale the card, so the order here matters

}
function expandNode(id) {

  el.style.transform = `translate(-50%,-50%) scale(${1 / camScale})`;

// ── 턴 자산(첨부 이미지·코드 diff) 지연 로드: 카드가 열린 뒤 원문에서 가져와 붙인다 ──
// 부가층 원칙 — 실패·지연은 조용히 무시되고 카드 본문은 항상 동작한다.
async function loadAssets(id) {
  try {
    const t = byId[id]; if (!t || t._pseudo) return;
    // 이미지도 편집 도구도 없는 턴은 서버 왕복 자체를 생략
    if (!t.hasImage && !t.tools.some(x => x.category === "edit")) return;
    const j = await fetch(`/api/expand?project=${encodeURIComponent(CURRENT_PROJECT)}&turn=${encodeURIComponent(id)}`).then(r => r.json());
    if (expandedId !== id) return; // 기다리는 사이 카드가 닫히거나 바뀜 — 버린다
    const host = document.getElementById("d-assets"); if (!host) return;
    let h = "";
    if (Array.isArray(j.images) && j.images.length) {
      h += `<div class="d-h">첨부 이미지 (${j.images.length})</div><div class="d-imgs">` +
        j.images.map(im => `<img class="d-img" loading="lazy" alt="첨부 이미지" onclick="event.stopPropagation(); this.classList.toggle('zoom')" src="data:${esc(String(im.mediaType))};base64,${String(im.data).replace(/[^A-Za-z0-9+/=]/g, "")}">`).join("") + `</div>`;
    }
    if (Array.isArray(j.diffs) && j.diffs.length) {

        `<div class="d-difffile">${esc(String(d.file))}</div><pre class="d-diff">` +
        (Array.isArray(d.lines) ? d.lines : []).map(l => {
          l = String(l);
          const c = l.startsWith("+") ? "dl-add" : l.startsWith("-") ? "dl-del" : l.startsWith("@@") ? "dl-hunk" : "";
          return `<span class="${c}">${esc(l)}</span>`;
        }).join("\n") + `</pre>`).join("");
    }
    host.innerHTML = h;
  } catch { /* 자산은 부가층 — 실패해도 카드는 그대로 */ }
}

// ── 갈래(브랜치) 대화: 이 턴 시점의 맥락만 아는 AI와 나누는 곁가지 대화 ──

// ── 갈래 워프 뷰: 갈래를 별도 세션처럼 노드 선으로 렌더 — 포탈과 같은 이동 문법 ──

const BR_INFLIGHT = new Set(); // 갈래별 진행 중 요청 — 이탈·재진입해도 중복 전송 방지
async function sendBranchWarp() {
  const input = document.getElementById("bb-q");
  const q = input.value.trim();
  if (!q || !BRANCH_SCOPE || PENDING_BR || BR_INFLIGHT.has(BRANCH_SCOPE)) return;
  input.value = "";
  const brId = BRANCH_SCOPE, proj = CURRENT_PROJECT;
  BR_INFLIGHT.add(brId);
  PENDING_BR = { brId, q };
  showBusy("갈래 응답 생성 중…", "이 시점까지만 아는 AI가 답을 쓰는 중 — 최대 3분");
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => focusOn("pending")));
  try {
    const j = await api("/api/branch-chat", { project: proj, id: brId, question: q });
    if (j.error) throw new Error(j.error);
    const i = BRANCHES.findIndex(b => b.id === brId);
    if (i >= 0) BRANCHES[i] = j.branch;
    if (PENDING_BR?.brId === brId) PENDING_BR = null;
    // 대기 중 다른 화면으로 이동했으면 데이터만 갱신(오귀속 방지)
    if (BRANCH_SCOPE === brId && CURRENT_PROJECT === proj) {
      render();
      requestAnimationFrame(() => requestAnimationFrame(() => { if (BR_LAST_ID) focusOn(BR_LAST_ID); }));
    }
  } catch (e) {
    if (PENDING_BR?.brId === brId) PENDING_BR = null;
    if (BRANCH_SCOPE === brId) {
      render();
      const inp = document.getElementById("bb-q");
      if (inp) inp.value = q; // 낙관 롤백 — 입력 복원
    }
    alert("갈래 대화 실패: " + e.message);
  } finally {
    BR_INFLIGHT.delete(brId);
    hideBusy(); // 어떤 경로로 끝나든 오버레이는 반드시 걷는다
  }
}

function pathToRoot(id) { const p = []; let cur = id; while (cur) { p.unshift(cur); cur = parentOf[cur]; } return p; }

  // 서로 조상·자손 관계가 아니면 범위가 안 된다 — 그 자리로 앵커만 새로 잡는다

  try {
    const ids = rangeIds();
    const anchor = ids[ids.length - 1]; // 선택 경로의 마지막 턴에 갈래를 매단다
    if (!anchor || !PKG?.pkgFile) throw new Error("패키지 정보가 없습니다");
    btn.disabled = true;
    const br = await api("/api/branch-create", {
      project: CURRENT_PROJECT, kind: "compact", turnId: anchor,
      pkgFile: PKG.pkgFile, title: "압축 갈래 " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }),
    });
    if (br.error) throw new Error(br.error);
    BRANCHES.push(br);
    modal.classList.remove("open");
    enterBranchView(br.id); // 바로 갈래 워프 뷰로 진입
  } catch (e) { alert("갈래 생성 실패: " + e.message); }
  btn.disabled = false;
});
document.getElementById("m-dl-md").addEventListener("click", () => download("md"));
document.getElementById("m-dl-json").addEventListener("click", () => download("json"));
function download(kind) {
  const content = kind === "md" ? PKG.md : JSON.stringify(PKG.json, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: "text/plain" }));
  // 스킬 초안(pkgFile 없음)은 스킬 이름으로 — SKILL.md로 바로 배포·검수가 자연스럽게
  a.download = PKG?.pkgFile ? `branchport-package.${kind}` : `${PKG?.json?.name ?? "branchport-skill"}.${kind}`;
  a.click(); URL.revokeObjectURL(a.href);
}

window.addEventListener("resize", () => { if (!expandedId) fitAll(true); });
loadProjects();
</script>
